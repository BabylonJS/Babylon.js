# =============================================================================
# Publish Pipeline (Definition ID: 15)
# Converted from Azure DevOps Classic Pipeline
#
# Triggered when .build/config.json is changed on master.
# Handles versioning, building, publishing to npm, creating GitHub releases,
# and pushing tags.
#
# Variable groups:
#   - BabylonJS-CI-Infrastructure
#   - BabylonJS-Deployment (DEPLOY_TOKEN, DEPLOYMENT_SERVER)
#
# Secret variables (configure in pipeline UI):
#   - GitHubPAT
#   - NPM_TOKEN
#
# CREDENTIAL HANDLING RULES (see VARIABLE-GROUPS.md "CI trust boundary"):
#   - Credentials are never embedded in remote URLs or command lines, so they
#     cannot be recovered from .git/config, the process table, or shell traces.
#   - GitHubPAT is mapped into the environment of only the steps that need it
#     and the git credential helper that consumes it is removed afterwards.
#   - NPM_TOKEN is written to an ephemeral npm user config outside the working
#     directory (mode 0600) that is deleted when the job ends, so third-party
#     lifecycle scripts executed by `npm ci`/`npm install` cannot read it.
#   - Publishing runs with `--ignore-scripts`; no published workspace defines
#     prepack/prepublishOnly, so no lifecycle code executes while the registry
#     token is reachable.
# =============================================================================

trigger:
    batch: true
    branches:
        include:
            - master
    paths:
        include:
            - .build/config.json

pr: none

variables:
    - group: BabylonJS-CI-Infrastructure
    - group: BabylonJS-Deployment

pool:
    vmImage: ubuntu-latest

jobs:
    - job: PublishToNpm
      displayName: "Publish to npm"
      steps:
          - checkout: self
            clean: true
            fetchDepth: 0
            fetchTags: true
            persistCredentials: false

          - task: UseNode@1
            displayName: "Use Node 24.x"
            inputs:
                version: "24.x"

          - bash: |
                set -euo pipefail

                git config --global user.email "$(BOT_EMAIL)"
                git config --global user.name "Babylon.js Platform"

                # Anonymous remote: BabylonJS/Babylon.js is public, so fetching
                # needs no credentials. Keeping the PAT out of the remote URL
                # keeps it out of .git/config, where every later step - including
                # third-party npm lifecycle scripts - could otherwise read it.
                git remote set-url origin https://github.com/BabylonJS/Babylon.js.git ||
                    git remote add origin https://github.com/BabylonJS/Babylon.js.git

                git fetch origin
                git checkout "$(Build.SourceBranchName)"
            displayName: "prepare git"

          - bash: npm ci
            displayName: "npm ci"
            env:
                PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
                PUPPETEER_SKIP_DOWNLOAD: "true"

          - bash: node ./scripts/updateVersion.js $(Build.SourceBranchName)
            displayName: "run updater"
            env:
                GITHUBPAT: $(GitHubPAT)

          - bash: npm install
            displayName: "Update package-lock.json"
            env:
                PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
                PUPPETEER_SKIP_DOWNLOAD: "true"

          - bash: node ./scripts/tagVersion.js $(Build.SourceBranchName)
            displayName: "Tag the version"

          - bash: npm run format:fix
            displayName: "fix formatting"

          - bash: npm run test:unit
            displayName: "unit tests"
            retryCountOnTaskFailure: 2

          - bash: npm run build:umd
            displayName: "npm build umd"

          - bash: npm run build:es6
            displayName: "npm build es6"

          - bash: |
                set -euo pipefail

                # The registry token lives in an ephemeral npm user config outside
                # the sources directory instead of ./.npmrc, so it is never picked
                # up by unrelated npm invocations or readable by lifecycle scripts
                # running from the working directory.
                NPM_AUTH_CONFIG="$(Agent.TempDirectory)/.npmrc-publish"
                install -m 600 /dev/null "$NPM_AUTH_CONFIG"
                {
                    printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN"
                    printf 'ignore-scripts=true\n'
                } > "$NPM_AUTH_CONFIG"

                echo "##vso[task.setvariable variable=NpmAuthConfig]$NPM_AUTH_CONFIG"
            displayName: "write npm auth config"
            env:
                NPM_TOKEN: $(NPM_TOKEN)

          - bash: npm publish -ws --access=public --ignore-scripts
            displayName: "publish latest stable (master branch)"
            condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'master'))
            env:
                NPM_CONFIG_USERCONFIG: $(NpmAuthConfig)

          - bash: npm publish -ws --tag preview --ignore-scripts
            displayName: "publish preview (preview branch)"
            condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'preview'))
            env:
                NPM_CONFIG_USERCONFIG: $(NpmAuthConfig)

          - bash: rm -f "$(Agent.TempDirectory)/.npmrc-publish"
            displayName: "remove npm auth config"
            condition: always()

          - bash: |
                set -euo pipefail

                # The PAT is only reachable inside this step: it is passed through
                # the environment, consumed by an inline credential helper, and the
                # helper is removed from .git/config before the step exits.
                cleanup() {
                    git config --local --unset-all credential.helper || true
                }
                trap cleanup EXIT

                git config --local credential.helper '!f() { printf "username=x-access-token\npassword=%s\n" "${GITHUBPAT}"; }; f'

                git fetch origin
                git merge "origin/$(Build.SourceBranchName)"
                git push origin "$(Build.SourceBranchName)" --tags
            displayName: "merge and push to git"
            env:
                GITHUBPAT: $(GitHubPAT)

          - bash: |
                set -euo pipefail
                pv=$(jq -r '.version' ./packages/public/umd/babylonjs/package.json)
                releaseCommit=$(git rev-parse "${pv}^{commit}")
                echo "##vso[task.setvariable variable=PackageVersion]${pv}"
                echo "##vso[task.setvariable variable=ReleaseCommit]${releaseCommit}"
            displayName: "Get release version and commit"

          - bash: |
                npm run prepare-snapshot

                zip -r $(Build.ArtifactStagingDirectory)/cdnSnapshot.zip .snapshot
            displayName: "prepare snapshot"
            condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'master'))

          - task: GitHubRelease@1
            displayName: "GitHub release (create)"
            continueOnError: true
            condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'master'))
            inputs:
                gitHubConnection: "$(GITHUB_SERVICE_CONNECTION)"
                repositoryName: "BabylonJS/Babylon.js"
                action: create
                target: "$(ReleaseCommit)"
                tagSource: userSpecifiedTag
                tag: "$(PackageVersion)"
                assets: "$(Build.ArtifactStagingDirectory)/cdnSnapshot.zip"
                isDraft: false
                isPreRelease: false
                addChangeLog: false
                releaseNotesFilePath: ".build/release-notes.md"

          - script: |
                cd .snapshot
                zip -r ../snapshot.zip *
                cd ..

                curl --fail-with-body --silent --show-error $(DEPLOYMENT_SERVER)/$(DEPLOY_ENDPOINT_UPLOAD) -i -X POST \
                  -H "Content-Type: multipart/form-data" \
                  -H "Authorization: Bearer $(DEPLOY_TOKEN)" \
                  -F "path=cdn/master/v$(PackageVersion)" \
                  -F "storageAccount=$(SNAPSHOTS_STORAGE_ACCOUNT)" \
                  -F "saveZip=true" \
                  -F "zip=@snapshot.zip"
            displayName: "Update snapshot"

          - task: Npm@1
            displayName: "run build -w @tools/tests"
            inputs:
                command: custom
                customCommand: "run build -w @tools/tests"

          - task: Npm@1
            displayName: "npm generate modules size"
            inputs:
                command: custom
                customCommand: "run generate-file-size-report -w @tools/tests"

          - script: |
                # filesize
                cd packages/tools/tests/dist
                zip ../../../../fileSize.zip fileSizes.json
                cd ../../../..

                curl --fail-with-body --silent --show-error $(DEPLOYMENT_SERVER)/$(DEPLOY_ENDPOINT_UPLOAD) -i -X POST \
                  -H "Content-Type: multipart/form-data" \
                  -H "Authorization: Bearer $(DEPLOY_TOKEN)" \
                  -F "path=cdn/master/v$(PackageVersion)" \
                  -F "storageAccount=$(SNAPSHOTS_STORAGE_ACCOUNT)" \
                  -F "zip=@fileSize.zip"
            displayName: "Update snapshot modules size"

          # DISABLED in classic pipeline:
          # - script: |
          #     node ./packages/public/@babylonjs/inspector-v2/prepublish.cjs
          #     node ./packages/public/umd/babylonjs-inspector-v2/prepublish.cjs
          #   displayName: 'Run inspector v2 preview script'

          # - script: npm install
          #   displayName: 'npm install (for @babylonjs/inspector-v2 -> @babylonjs/inspector)'

          # - script: |
          #     npm publish -w @babylonjs/inspector --tag preview
          #     npm publish -w babylonjs-inspector --tag preview
          #   displayName: 'publish inspector v2 preview'
