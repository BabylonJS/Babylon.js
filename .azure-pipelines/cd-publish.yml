# =============================================================================
# Publish Pipeline (Definition ID: 15)
# Converted from Azure DevOps Classic Pipeline
#
# Triggered when .build/config.json is changed on master.
# Handles versioning, building, publishing to npm, creating GitHub releases,
# and pushing tags.
#
# Variable groups:
#   - BabylonJS-CI-Infrastructure
#   - BabylonJS-Deployment (DEPLOY_TOKEN, DEPLOYMENT_SERVER)
#   - NPM_Publish (NPM_TOKEN)
#
# Secret variables (configure in pipeline UI):
#   - GitHubPAT
# =============================================================================

trigger:
    batch: true
    branches:
        include:
            - master
    paths:
        include:
            - .build/config.json

pr: none

variables:
    - group: BabylonJS-CI-Infrastructure
    - group: BabylonJS-Deployment
    - group: NPM_Publish

pool:
    vmImage: ubuntu-latest

jobs:
    - job: PublishToNpm
      displayName: "Publish to npm"
      timeoutInMinutes: 120
      steps:
          - checkout: self
            clean: true
            fetchDepth: 0
            fetchTags: true

          - task: UseNode@1
            displayName: "Use Node 24.x"
            inputs:
                version: "24.x"

          - script: |
                set -euo pipefail
                set +x

                git config --global user.email "$(BOT_EMAIL)"
                git config --global user.name "Babylon.js Platform"

                repoUrl="https://github.com/BabylonJS/Babylon.js.git"
                git remote set-url origin "$repoUrl"

                auth=$(printf 'x-access-token:%s' "$GITHUB_PAT" | base64 | tr -d '\r\n')
                echo "##vso[task.setsecret]${auth}"
                git config --local --replace-all \
                    "http.${repoUrl}.extraheader" \
                    "Authorization: Basic ${auth}"

                git fetch origin
                git checkout "$(Build.SourceBranchName)"
            displayName: "prepare git"
            env:
                GITHUB_PAT: $(GitHubPAT)

          - script: npm ci
            displayName: "npm ci"
            env:
                PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
                PUPPETEER_SKIP_DOWNLOAD: "true"

          - script: node ./scripts/updateVersion.js $(Build.SourceBranchName)
            displayName: "run updater"
            env:
                GITHUBPAT: $(GitHubPAT)

          - script: npm install
            displayName: "Update package-lock.json"
            env:
                PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
                PUPPETEER_SKIP_DOWNLOAD: "true"

          - script: npm run format:fix
            displayName: "fix formatting"
            env:
                GITHUBPAT: $(GitHubPAT)

          - script: node ./scripts/tagVersion.js $(Build.SourceBranchName)
            displayName: "Tag the version"
            env:
                GITHUBPAT: $(GitHubPAT)

          - script: |
                set -euo pipefail
                pv=$(jq -r '.version' ./packages/public/umd/babylonjs/package.json)
                releaseCommit=$(git rev-parse "${pv}^{commit}")
                if [[ "$(git rev-parse HEAD)" != "$releaseCommit" ]]; then
                    echo "Version tag does not point at the current release commit" >&2
                    exit 1
                fi
                git checkout --detach "$releaseCommit"
                if [[ "$(git rev-parse HEAD)" != "$releaseCommit" ]]; then
                    echo "Checkout did not resolve to the tagged release commit" >&2
                    exit 1
                fi
                echo "##vso[task.setvariable variable=PackageVersion]${pv}"
                echo "##vso[task.setvariable variable=ReleaseCommit]${releaseCommit}"
            displayName: "Checkout tagged release commit"

          - script: npm run test:unit
            displayName: "unit tests"
            retryCountOnTaskFailure: 2

          - script: npm run build:umd
            displayName: "npm build umd"

          - script: npm run build:es6
            displayName: "npm build es6"

          - task: Npm@1
            displayName: "run build -w @tools/tests"
            condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'master'))
            inputs:
                command: custom
                customCommand: "run build -w @tools/tests"

          - script: npm run generate-file-size-report -w @tools/tests
            displayName: "npm generate modules size"
            condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'master'))

          - script: |
                set -euo pipefail
                npm run prepare-snapshot

                requiredFiles=(
                    ".snapshot/babylon.js"
                    ".snapshot/babylon.max.js"
                    ".snapshot/loaders/babylonjs.loaders.js"
                    ".snapshot/babylon.ktx2Decoder.js"
                    ".snapshot/ktx2Transcoders/1/msc_basis_transcoder.js"
                    ".snapshot/ktx2Transcoders/1/msc_basis_transcoder.wasm"
                    ".snapshot/ktx2Transcoders/1/uastc_rgba8_unorm_v2.wasm"
                    ".snapshot/zstddec.wasm"
                    ".snapshot/fileSizes.json"
                )
                for file in "${requiredFiles[@]}"; do
                    if [[ ! -s "$file" ]]; then
                        echo "Required CDN snapshot asset is missing or empty: $file" >&2
                        exit 1
                    fi
                done

                stagingDir="$(Build.ArtifactStagingDirectory)"
                mkdir -p "$stagingDir"
                snapshotZip="$stagingDir/snapshot.zip"
                rm -f "$snapshotZip" "$stagingDir/cdnSnapshot.zip"
                cd .snapshot
                zip -r "$snapshotZip" *
                cd ..

                # Healthy releases are about 106 MB compressed. This 50 MB floor
                # allows substantial size variation while rejecting truncated snapshots.
                minimumArchiveSize=50000000
                archiveSize=$(stat -c%s "$snapshotZip")
                if (( archiveSize < minimumArchiveSize )); then
                    echo "CDN snapshot archive is too small: ${archiveSize} bytes (minimum ${minimumArchiveSize})" >&2
                    exit 1
                fi
                zip -r "$stagingDir/cdnSnapshot.zip" .snapshot
            displayName: "prepare snapshot"
            condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'master'))

          - script: |
                set -euo pipefail

                curl --fail-with-body --silent --show-error $(DEPLOYMENT_SERVER)/$(DEPLOY_ENDPOINT_UPLOAD) -i -X POST \
                  -H "Content-Type: multipart/form-data" \
                  -H "Authorization: Bearer $(DEPLOY_TOKEN)" \
                  -F "path=cdn/master/v$(PackageVersion)" \
                  -F "storageAccount=$(SNAPSHOTS_STORAGE_ACCOUNT)" \
                  -F "saveZip=true" \
                  -F "zip=@$(Build.ArtifactStagingDirectory)/snapshot.zip"
            displayName: "Update snapshot"
            condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'master'))

          - script: |
                set -euo pipefail
                cd packages/tools/tests/dist
                zip "$(Build.ArtifactStagingDirectory)/fileSize.zip" fileSizes.json
                cd ../../../..

                curl --fail-with-body --silent --show-error $(DEPLOYMENT_SERVER)/$(DEPLOY_ENDPOINT_UPLOAD) -i -X POST \
                  -H "Content-Type: multipart/form-data" \
                  -H "Authorization: Bearer $(DEPLOY_TOKEN)" \
                  -F "path=cdn/master/v$(PackageVersion)" \
                  -F "storageAccount=$(SNAPSHOTS_STORAGE_ACCOUNT)" \
                  -F "zip=@$(Build.ArtifactStagingDirectory)/fileSize.zip"
            displayName: "Update snapshot modules size"
            condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'master'))

          - script: |
                set -euo pipefail
                releaseNotes="$(Build.ArtifactStagingDirectory)/release-notes.md"
                cp .build/release-notes.md "$releaseNotes"
                test -s "$releaseNotes"
            displayName: "Preserve release notes"
            condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'master'))

          - script: |
                set -euo pipefail

                baseUrl="https://cdn.babylonjs.com/v$(PackageVersion)"
                assets=(
                    "babylon.js"
                    "babylon.max.js"
                    "loaders/babylonjs.loaders.js"
                    "babylon.ktx2Decoder.js"
                    "ktx2Transcoders/1/msc_basis_transcoder.js"
                    "ktx2Transcoders/1/msc_basis_transcoder.wasm"
                    "zstddec.wasm"
                    "fileSizes.json"
                )
                deadline=$((SECONDS + 600))
                for asset in "${assets[@]}"; do
                    url="${baseUrl}/${asset}"
                    status="000"
                    attempt=0
                    while (( SECONDS < deadline )); do
                        attempt=$((attempt + 1))
                        # Unique query avoids reusing a cached 404 while the upload propagates.
                        if status=$(curl --connect-timeout 10 --max-time 60 --silent --show-error \
                            --output /dev/null --write-out "%{http_code}" "${url}?releaseCheck=$(Build.BuildId)-${attempt}"); then
                            if [[ "$status" == "200" ]]; then
                                echo "Verified ${url}"
                                break
                            fi
                        else
                            status="000"
                        fi
                        echo "Waiting for ${url} (HTTP ${status})"
                        sleep 15
                    done
                    if [[ "$status" != "200" ]]; then
                        echo "CDN asset did not become available: ${url} (last HTTP status ${status})" >&2
                        exit 1
                    fi
                done
            displayName: "Verify versioned CDN snapshot"
            condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'master'))

          - script: echo "//registry.npmjs.org/:_authToken=$(NPM_TOKEN)" > ./.npmrc
            displayName: "write npmrc"

          - script: npm publish -ws --access=public
            displayName: "publish latest stable (master branch)"
            condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'master'))

          - script: npm publish -ws --tag preview
            displayName: "publish preview (preview branch)"
            condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'preview'))

          - script: |
                set -euo pipefail
                git checkout "$(Build.SourceBranchName)"
            displayName: "Return to release branch"

          - script: git fetch origin
            displayName: "fetch origin"

          - script: git merge origin/$(Build.SourceBranchName)
            displayName: "pull master"

          - script: git push origin $(Build.SourceBranchName) --tags
            displayName: "push to git"

          # Runs after the push so GitHub can resolve the release commit and tag.
          - task: GitHubRelease@1
            displayName: "GitHub release (create)"
            condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'master'))
            inputs:
                gitHubConnection: "$(GITHUB_SERVICE_CONNECTION)"
                repositoryName: "BabylonJS/Babylon.js"
                action: create
                target: "$(ReleaseCommit)"
                tagSource: userSpecifiedTag
                tag: "$(PackageVersion)"
                assets: "$(Build.ArtifactStagingDirectory)/cdnSnapshot.zip"
                isDraft: false
                isPreRelease: false
                addChangeLog: false
                releaseNotesFilePath: "$(Build.ArtifactStagingDirectory)/release-notes.md"

          # DISABLED in classic pipeline:
          # - script: |
          #     node ./packages/public/@babylonjs/inspector-v2/prepublish.cjs
          #     node ./packages/public/umd/babylonjs-inspector-v2/prepublish.cjs
          #   displayName: 'Run inspector v2 preview script'

          # - script: npm install
          #   displayName: 'npm install (for @babylonjs/inspector-v2 -> @babylonjs/inspector)'

          # - script: |
          #     npm publish -w @babylonjs/inspector --tag preview
          #     npm publish -w babylonjs-inspector --tag preview
          #   displayName: 'publish inspector v2 preview'
