# =============================================================================
# CD-Tools Pipeline (Definition ID: 16)
# Converted from Azure DevOps Classic Pipeline
#
# Builds and deploys all tools (Playground, Sandbox, NME, NGE, NRGE,
# GUI Editor, NPE, FGE) to production storage after a successful publish.
#
# Triggers:
#   - Schedule: midnight PST on Tue/Wed/Fri/Sat (daysToBuild: 22)
#   - Build completion from Publish pipeline (ID: 15)
#
# Variable groups:
#   - BabylonJS-CI-Infrastructure (pipeline scope, no secrets)
#   - BabylonJS-Deployment (DEPLOY_TOKEN, DEPLOYMENT_SERVER) - scoped to the
#     DeployTools job only.
#
# Security shape:
#   BuildTools runs `npm ci` and the tool builds, so it executes third-party
#   lifecycle scripts and repository code. It holds no credential and stages
#   every tool as an immutable pipeline artifact. DeployTools then runs on a
#   fresh agent with `checkout: none`, asserts a trusted source ref, and is the
#   only job that ever sees DEPLOY_TOKEN.
# =============================================================================

trigger: none
pr: none

schedules:
    # Midnight PST = 08:00 UTC
    # daysToBuild 22 = binary 10110 = Tue,Wed,Fri,Sat
    # (Azure classic uses bit flags: Mon=1,Tue=2,Wed=4,Thu=8,Fri=16,Sat=32,Sun=64)
    # 22 = 2+4+16 = Tue,Wed,Fri
    - cron: "0 8 * * 2,3,5"
      displayName: Scheduled tools deployment
      branches:
          include:
              - master
      always: false

resources:
    pipelines:
        - pipeline: publishPipeline
          source: "Publish pipeline" # Update with actual pipeline name
          trigger:
              branches:
                  include:
                      - master

variables:
    # Only non-secret infrastructure values are in scope for the whole pipeline.
    # BabylonJS-Deployment (DEPLOY_TOKEN) is linked to the DeployTools job
    # alone, so the job that runs npm lifecycle scripts and tool builds never
    # has the deployment token in its variable scope.
    - group: BabylonJS-CI-Infrastructure

pool:
    vmImage: ubuntu-latest

jobs:
    - job: BuildTools
      displayName: "Build tools"
      steps:
          - template: templates/checkout-with-tag-override.yml
            parameters:
                fetchTags: true

          - task: UseNode@1
            displayName: "Use Node 24.x"
            inputs:
                version: "24.x"

          - task: Npm@1
            displayName: "npm ci"
            retryCountOnTaskFailure: 2
            inputs:
                command: custom
                customCommand: "ci"

          # DISABLED in classic pipeline:
          # - task: Npm@1
          #   displayName: 'npm update-version (for smart filters)'
          #   inputs:
          #     command: custom
          #     customCommand: 'run update-version -w @dev/smart-filters'

          - task: Npm@1
            displayName: "build dev"
            inputs:
                command: custom
                customCommand: "run build:dev"

          # DISABLED in classic pipeline:
          # - task: Npm@1
          #   displayName: 'build smart filters core'
          #   inputs:
          #     command: custom
          #     customCommand: 'run build:source:smart-filters'

          - task: Npm@1
            displayName: "build playground"
            inputs:
                command: custom
                customCommand: "run build:deployment -w @tools/playground"

          - task: Npm@1
            displayName: "build sandbox"
            inputs:
                command: custom
                customCommand: "run build:deployment -w @tools/sandbox"

          - task: Npm@1
            displayName: "build gui editor"
            inputs:
                command: custom
                customCommand: "run build:deployment -w @tools/gui-editor"

          - task: Npm@1
            displayName: "build node editor"
            inputs:
                command: custom
                customCommand: "run build:deployment -w @tools/node-editor"

          - task: Npm@1
            displayName: "build node geometry editor"
            inputs:
                command: custom
                customCommand: "run build:deployment -w @tools/node-geometry-editor"

          - task: Npm@1
            displayName: "build node graph editor"
            inputs:
                command: custom
                customCommand: "run build:deployment -w @tools/node-render-graph-editor"

          - task: Npm@1
            displayName: "build node particle editor"
            inputs:
                command: custom
                customCommand: "run build:deployment -w @tools/node-particle-editor"

          - task: Npm@1
            displayName: "build flow graph editor"
            inputs:
                command: custom
                customCommand: "run build:deployment -w @tools/flow-graph-editor"

          # DISABLED in classic pipeline:
          # - task: Npm@1
          #   displayName: 'build smart filters editor'
          #   inputs:
          #     command: custom
          #     customCommand: 'run build:deployment -w @tools/smart-filters-editor'

          - template: templates/stage-tool-deployment.yml
            parameters:
                toolPackageDir: "packages/tools/sandbox"
                artifact: "tool-deploy-sandbox"
                displayName: "Sandbox deployment (stage)"

          - template: templates/stage-tool-deployment.yml
            parameters:
                toolPackageDir: "packages/tools/playground"
                artifact: "tool-deploy-playground"
                displayName: "Playground deployment (stage)"

          - template: templates/stage-tool-deployment.yml
            parameters:
                toolPackageDir: "packages/tools/nodeEditor"
                artifact: "tool-deploy-nodeEditor"
                displayName: "NME deployment (stage)"

          - template: templates/stage-tool-deployment.yml
            parameters:
                toolPackageDir: "packages/tools/nodeGeometryEditor"
                artifact: "tool-deploy-nodeGeometryEditor"
                displayName: "NGE deployment (stage)"

          - template: templates/stage-tool-deployment.yml
            parameters:
                toolPackageDir: "packages/tools/nodeRenderGraphEditor"
                artifact: "tool-deploy-nodeRenderGraphEditor"
                displayName: "NRGE deployment (stage)"

          - template: templates/stage-tool-deployment.yml
            parameters:
                toolPackageDir: "packages/tools/guiEditor"
                artifact: "tool-deploy-guiEditor"
                displayName: "GUI Editor deployment (stage)"

          - template: templates/stage-tool-deployment.yml
            parameters:
                toolPackageDir: "packages/tools/nodeParticleEditor"
                artifact: "tool-deploy-nodeParticleEditor"
                displayName: "NPE deployment (stage)"

          - template: templates/stage-tool-deployment.yml
            parameters:
                toolPackageDir: "packages/tools/flowGraphEditor"
                artifact: "tool-deploy-flowGraphEditor"
                displayName: "FGE deployment (stage)"

          # DISABLED in classic pipeline:
          # - script: |
          #     # sfe
          #     cd packages/tools/smartFiltersEditor/dist
          #     zip -r ../../../../dist.zip *
          #     cd ..
          #     cd public
          #     zip -r ../../../../public.zip *
          #     cd ../../../..
          #
          #     curl $(DEPLOYMENT_SERVER)/$(DEPLOY_ENDPOINT_UPLOAD) -i -X POST \
          #       -H "Content-Type: multipart/form-data" \
          #       -H "Authorization: $(DEPLOY_TOKEN)" \
          #       -F "path=smartFiltersEditor" \
          #       -F "storageAccount=$(TOOLS_STORAGE_ACCOUNT)" \
          #       -F "zip=@dist.zip"
          #     curl $(DEPLOYMENT_SERVER)/$(DEPLOY_ENDPOINT_UPLOAD) -i -X POST \
          #       -H "Content-Type: multipart/form-data" \
          #       -H "Authorization: $(DEPLOY_TOKEN)" \
          #       -F "path=smartFiltersEditor" \
          #       -F "storageAccount=$(TOOLS_STORAGE_ACCOUNT)" \
          #       -F "zip=@public.zip"
          #
          #     curl "$(DEPLOYMENT_SERVER)/$(DEPLOY_ENDPOINT_PURGE)?endpoint=$(CDN_ENDPOINT_SFE)&profileName=$(CDN_PROFILE_TOOLS)&wait=true" -i -X POST -H "Authorization: $(DEPLOY_TOKEN)"
          #   displayName: 'SFE deployment'

          # DISABLED in classic pipeline - Azure CLI upload and purge steps:
          # These used an ARM service connection and direct az CLI calls.
          # If re-enabled, the azureSubscription ID and resource group name
          # should be moved to the variable group.
          # See the original classic pipeline (Definition 16) for reference.

    # =========================================================================
    # Deploy the staged tools.
    #
    # Fresh agent, `checkout: none`, no npm and no repository code: the only
    # thing this job does is push immutable artifacts produced by BuildTools to
    # the deployment server. DEPLOY_TOKEN exists only here, so nothing built
    # from the repository ever shares an agent with it.
    # =========================================================================
    - template: templates/publish-uploads-job.yml
      parameters:
          jobName: DeployTools
          displayName: "Deploy tools"
          dependsOn:
              - BuildTools
          condition: succeeded()
          requireTrustedSource: true
          storageAccount: "$(TOOLS_STORAGE_ACCOUNT)"
          variables:
              - group: BabylonJS-Deployment
          uploads:
              - artifact: "tool-deploy-sandbox"
                destination: "sandbox"
                deleteStale: false
                extraFields: []
                displayName: "Sandbox deployment (upload)"
              - artifact: "tool-deploy-playground"
                destination: "playground"
                deleteStale: false
                extraFields: []
                displayName: "Playground deployment (upload)"
              - artifact: "tool-deploy-nodeEditor"
                destination: "nodeEditor"
                deleteStale: false
                extraFields: []
                displayName: "NME deployment (upload)"
              - artifact: "tool-deploy-nodeGeometryEditor"
                destination: "nodeGeometryEditor"
                deleteStale: false
                extraFields: []
                displayName: "NGE deployment (upload)"
              - artifact: "tool-deploy-nodeRenderGraphEditor"
                destination: "nodeRenderGraphEditor"
                deleteStale: false
                extraFields: []
                displayName: "NRGE deployment (upload)"
              - artifact: "tool-deploy-guiEditor"
                destination: "guiEditor"
                deleteStale: false
                extraFields: []
                displayName: "GUI Editor deployment (upload)"
              - artifact: "tool-deploy-nodeParticleEditor"
                destination: "nodeParticleEditor"
                deleteStale: false
                extraFields: []
                displayName: "NPE deployment (upload)"
              - artifact: "tool-deploy-flowGraphEditor"
                destination: "flowGraphEditor"
                deleteStale: false
                extraFields: []
                displayName: "FGE deployment (upload)"
          purges:
              - endpoint: "$(CDN_ENDPOINT_SANDBOX)"
                profile: "$(CDN_PROFILE_SANDBOX)"
                displayName: "Purge CDN (Sandbox)"
              - endpoint: "$(CDN_ENDPOINT_PLAYGROUND)"
                profile: "$(CDN_PROFILE_PLAYGROUND)"
                displayName: "Purge CDN (Playground)"
              - endpoint: "$(CDN_ENDPOINT_NME)"
                profile: "$(CDN_PROFILE_TOOLS)"
                displayName: "Purge CDN (NME)"
              - endpoint: "$(CDN_ENDPOINT_NGE)"
                profile: "$(CDN_PROFILE_TOOLS)"
                displayName: "Purge CDN (NGE)"
              - endpoint: "$(CDN_ENDPOINT_NRGE)"
                profile: "$(CDN_PROFILE_TOOLS)"
                displayName: "Purge CDN (NRGE)"
              - endpoint: "$(CDN_ENDPOINT_GUIEDITOR)"
                profile: "$(CDN_PROFILE_TOOLS)"
                displayName: "Purge CDN (GUI Editor)"
              - endpoint: "$(CDN_ENDPOINT_NPE)"
                profile: "$(CDN_PROFILE_TOOLS)"
                displayName: "Purge CDN (NPE)"
              - endpoint: "$(CDN_ENDPOINT_FGE)"
                profile: "$(CDN_PROFILE_TOOLS)"
                displayName: "Purge CDN (FGE)"
