# =============================================================================
# Browser Testing Pipeline (Definition ID: 27)
# Converted from Azure DevOps Classic Pipeline
#
# Nightly: Webkit and Firefox WebGL2 visualization tests, full Chrome WebGL2
#          and WebGPU visualization runs against the production CDN, plus
#          Google Closure Compiler validation.
# Weekly (Saturday): Full performance test suite across all visualization tests
#          (WebGL2 and WebGPU combined in a single job).
#
# Schedule: 1:00 AM PST daily (09:00 UTC), plus 3:00 AM PST Saturday (11:00 UTC)
#
# Variable groups:
#   - BabylonJS-CI-Infrastructure (no secrets) - pipeline scope
#   - Browserstack-Opensource (BROWSERSTACK_ACCESS_KEY, BROWSERSTACK_USERNAME) -
#     job scope, BrowserStack test jobs only
#   - BabylonJS-Deployment (DEPLOY_TOKEN) - job scope, PublishReports only
#
# Security shape:
#   This is the only pipeline in the repository that is allowed to hold the
#   BrowserStack credentials. It has no pull request trigger, so Azure DevOps
#   never compiles it from a pull request branch, and every credentialed job
#   asserts that the run comes from a trusted full ref before it starts, so a
#   manual queue against an unmerged branch cannot harvest the account. The
#   repository code these jobs execute is therefore always merged master code.
#
#   Test jobs stage their reports as pipeline artifacts; the upload happens in
#   PublishReports, a fresh `checkout: none` job that runs no repository or
#   dependency code and is the only holder of DEPLOY_TOKEN.
# =============================================================================

trigger: none
pr: none

schedules:
    # 1:00 AM PST = 09:00 UTC, all days
    - cron: "0 9 * * *"
      displayName: Nightly browser testing
      branches:
          include:
              - master
      always: false

    # 3:00 AM PST = 11:00 UTC, Saturday only
    - cron: "0 11 * * 6"
      displayName: Weekly performance tests
      branches:
          include:
              - master
      always: true

variables:
    # Non-secret infrastructure values (public CDN base URL, deployment server
    # endpoint names, storage account names). Needed by the report publisher and
    # by the report-URL log lines.
    - group: BabylonJS-CI-Infrastructure
    # No secret group is linked at pipeline level.
    #
    # Browserstack-Opensource is linked to the individual BrowserStack test jobs
    # (see the `variables:` block on each), so jobs that never talk to
    # BrowserStack - ClosureCompile, ResolvePerfVersions - do not have the
    # credentials in their variable scope at all. BabylonJS-Deployment
    # (DEPLOY_TOKEN) is linked to PublishReports alone, which runs on a fresh
    # agent with `checkout: none` and executes no repository or dependency code.
    - name: system.debug
      value: false
    # Stable path used by nightly jobs that publish test reports. Overwritten
    # on every nightly run so the URL stays the same.
    - name: NightlyReportRoot
      value: "nightly/testResults"

pool:
    vmImage: ubuntu-latest

jobs:
    # ============================================================================
    # WEBKIT WEBGL2 TESTS
    # ============================================================================
    - job: WebkitWebGL2
      displayName: "Webkit WebGL2 tests"
      variables:
          # Job-scoped: only the jobs that drive BrowserStack can see these.
          - group: Browserstack-Opensource
      steps:
          - template: templates/assert-trusted-source.yml

          - checkout: self
            clean: true
            fetchTags: false
            persistCredentials: false

          - task: UseNode@1
            displayName: "Use Node 24.x"
            inputs:
                version: "24.x"

          - script: npm ci
            displayName: "npm ci"
            env:
                PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
                PUPPETEER_SKIP_DOWNLOAD: "true"

          - script: npx playwright test --config ./playwright.browserstack.config.ts
            displayName: "Run tests (Webkit)"
            env:
                CDN_BASE_URL: "https://cdn.babylonjs.com"
                CI: "true"
                BSTACK_TEST_TYPE: "webgl2"
                BSTACK_BUILD_NAME: "Visualization Tests - Webkit"
                TIMEOUT: "20000"
                BROWSERSTACK_USERNAME: $(BROWSERSTACK_USERNAME)
                BROWSERSTACK_ACCESS_KEY: $(BROWSERSTACK_ACCESS_KEY)
                BSTACK_BROWSER: "playwright-webkit"
                BSTACK_OS: "OS X"
                BSTACK_OS_VERSION: "Sonoma"
                EXCLUDE_REGEX_ARRAY: "Picking Visual Test,GUI Input Test,Export GLTF Extension KHR_texture_transform,PBR refraction,Procedural textures playground,GLTF Serializer Morph Target Animation,GLTF Serializer KHR materials clearcoat,Motion Blur"
                SCREENSHOT_MAX_PIXEL: "6"
                SCREENSHOT_THRESHOLD: "0.05"

          # Stage the report as an immutable pipeline artifact. The upload
          # itself happens in PublishReports, which holds the deployment token
          # but never runs repository or test code.
          - template: templates/stage-upload.yml
            parameters:
                sourceDir: "packages/tools/tests/playwright-report"
                fallbackDir: "playwright-report"
                artifact: "browser-test-report-webkitplaywright"
                validatePublicReport: true
                displayName: "Stage nightly Webkit report"
                condition: "failed()"
                continueOnError: true

          - bash: |
                echo "##[section]Nightly Webkit WebGL2 report URL"
                echo "  $SNAPSHOT_CDN_URL/$NIGHTLY_REPORT_ROOT/webkitplaywright/index.html"
            displayName: "Log nightly Webkit report URL"
            condition: failed()
            env:
                SNAPSHOT_CDN_URL: $(SNAPSHOT_CDN_URL)
                NIGHTLY_REPORT_ROOT: $(NightlyReportRoot)

          - task: PublishTestResults@2
            displayName: "Publish Test Results"
            inputs:
                testResultsFormat: JUnit
                testResultsFiles: "./packages/tools/tests/junit.xml"

    # ============================================================================
    # FIREFOX WEBGL2 TESTS
    # ============================================================================
    - job: FirefoxWebGL2
      displayName: "Firefox WebGL2 tests"
      variables:
          # Job-scoped: only the jobs that drive BrowserStack can see these.
          - group: Browserstack-Opensource
      steps:
          - template: templates/assert-trusted-source.yml

          - checkout: self
            clean: true
            fetchTags: false
            persistCredentials: false

          - task: UseNode@1
            displayName: "Use Node 24.x"
            inputs:
                version: "24.x"

          - script: npm ci
            displayName: "npm ci"
            env:
                PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
                PUPPETEER_SKIP_DOWNLOAD: "true"

          - script: npx playwright test --config ./playwright.browserstack.config.ts
            displayName: "Run tests (Firefox)"
            env:
                CDN_BASE_URL: "https://cdn.babylonjs.com"
                CI: "true"
                BSTACK_TEST_TYPE: "webgl2"
                BSTACK_BUILD_NAME: "Visualization Tests - Firefox"
                TIMEOUT: "20000"
                BROWSERSTACK_USERNAME: $(BROWSERSTACK_USERNAME)
                BROWSERSTACK_ACCESS_KEY: $(BROWSERSTACK_ACCESS_KEY)
                BSTACK_BROWSER: "playwright-firefox"
                BSTACK_OS: "OS X"
                BSTACK_OS_VERSION: "Sonoma"
                EXCLUDE_REGEX_ARRAY: "Procedural textures playground,Normed 16 bits texture formats"
                SCREENSHOT_THRESHOLD: "0.05"
                SCREENSHOT_MAX_PIXEL: "5"

          # Stage the report as an immutable pipeline artifact. The upload
          # itself happens in PublishReports, which holds the deployment token
          # but never runs repository or test code.
          - template: templates/stage-upload.yml
            parameters:
                sourceDir: "packages/tools/tests/playwright-report"
                fallbackDir: "playwright-report"
                artifact: "browser-test-report-firefoxplaywright"
                validatePublicReport: true
                displayName: "Stage nightly Firefox report"
                condition: "failed()"
                continueOnError: true

          - bash: |
                echo "##[section]Nightly Firefox WebGL2 report URL"
                echo "  $SNAPSHOT_CDN_URL/$NIGHTLY_REPORT_ROOT/firefoxplaywright/index.html"
            displayName: "Log nightly Firefox report URL"
            condition: failed()
            env:
                SNAPSHOT_CDN_URL: $(SNAPSHOT_CDN_URL)
                NIGHTLY_REPORT_ROOT: $(NightlyReportRoot)

          - task: PublishTestResults@2
            displayName: "Publish Test Results"
            inputs:
                testResultsFormat: JUnit
                testResultsFiles: "./packages/tools/tests/junit.xml"

    # ============================================================================
    # NIGHTLY CHROME WEBGL2 — FULL VISUALIZATION RUN
    # Runs every nightly trigger against the production CDN. Mirrors the
    # This is the only place BrowserStack visualization coverage runs: the
    # equivalent ci-monorepo job was removed because that pipeline is compiled
    # from pull request branches. AFFECTED_TAGS=ALL, so the full suite runs.
    # ============================================================================
    - job: ChromeWebGL2Full
      displayName: "Chrome WebGL2 - full nightly"
      condition: eq(variables['Build.CronSchedule.DisplayName'], 'Nightly browser testing')
      variables:
          # Job-scoped: only the jobs that drive BrowserStack can see these.
          - group: Browserstack-Opensource
      steps:
          - template: templates/assert-trusted-source.yml

          - checkout: self
            clean: true
            fetchTags: false
            persistCredentials: false

          - task: UseNode@1
            displayName: "Use Node 24.x"
            inputs:
                version: "24.x"

          - script: npm ci
            displayName: "npm ci"
            env:
                PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
                PUPPETEER_SKIP_DOWNLOAD: "true"

          - bash: .azure-pipelines/browserstack-wait.sh npx playwright test --config ./playwright.browserstack.config.ts
            displayName: "Run tests (Chrome WebGL2 ALL)"
            env:
                CDN_BASE_URL: "https://cdn.babylonjs.com"
                CI: "true"
                EXCLUDE_REGEX_ARRAY: "Procedural textures playground"
                BSTACK_TEST_TYPE: "webgl2"
                BSTACK_BUILD_NAME: "Nightly Visualization Tests - Chrome WebGL2 ALL"
                TIMEOUT: "27500"
                AFFECTED_TAGS: "ALL"
                BROWSERSTACK_USERNAME: $(BROWSERSTACK_USERNAME)
                BROWSERSTACK_ACCESS_KEY: $(BROWSERSTACK_ACCESS_KEY)

          # Stage the report as an immutable pipeline artifact. The upload
          # itself happens in PublishReports, which holds the deployment token
          # but never runs repository or test code.
          - template: templates/stage-upload.yml
            parameters:
                sourceDir: "packages/tools/tests/playwright-report"
                fallbackDir: "playwright-report"
                artifact: "browser-test-report-webgl2playwright"
                validatePublicReport: true
                displayName: "Stage nightly WebGL2 report"
                condition: "failed()"
                continueOnError: true

          - bash: |
                echo "##[section]Nightly Chrome WebGL2 report URL"
                echo "  $SNAPSHOT_CDN_URL/$NIGHTLY_REPORT_ROOT/webgl2playwright/index.html"
            displayName: "Log nightly WebGL2 report URL"
            condition: failed()
            env:
                SNAPSHOT_CDN_URL: $(SNAPSHOT_CDN_URL)
                NIGHTLY_REPORT_ROOT: $(NightlyReportRoot)

          - task: PublishTestResults@2
            displayName: "Publish Test Results"
            condition: succeededOrFailed()
            inputs:
                testResultsFormat: JUnit
                testResultsFiles: "./packages/tools/tests/junit.xml"
                testRunTitle: "Nightly Chrome WebGL2 ALL"

    # ============================================================================
    # NIGHTLY CHROME WEBGPU — FULL VISUALIZATION RUN
    # Runs every nightly trigger against the production CDN. Mirrors the
    # the removed ci-monorepo WebGPU job, with AFFECTED_TAGS=ALL.
    # ============================================================================
    - job: ChromeWebGPUFull
      displayName: "Chrome WebGPU - full nightly"
      condition: eq(variables['Build.CronSchedule.DisplayName'], 'Nightly browser testing')
      variables:
          # Job-scoped: only the jobs that drive BrowserStack can see these.
          - group: Browserstack-Opensource
      steps:
          - template: templates/assert-trusted-source.yml

          - checkout: self
            clean: true
            fetchTags: false
            persistCredentials: false

          - task: UseNode@1
            displayName: "Use Node 24.x"
            inputs:
                version: "24.x"

          - script: npm ci
            displayName: "npm ci"
            env:
                PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
                PUPPETEER_SKIP_DOWNLOAD: "true"

          - bash: .azure-pipelines/browserstack-wait.sh npx playwright test --config ./playwright.browserstack.config.ts
            displayName: "Run tests (Chrome WebGPU ALL)"
            retryCountOnTaskFailure: 1
            env:
                CDN_BASE_URL: "https://cdn.babylonjs.com"
                CI: "true"
                EXCLUDE_REGEX_ARRAY: "Sample depth texture,Render to 3D RT,apply-all-post-processes"
                BSTACK_TEST_TYPE: "webgpu"
                BSTACK_BUILD_NAME: "Nightly Visualization Tests - Chrome WebGPU ALL"
                TIMEOUT: "27500"
                AFFECTED_TAGS: "ALL"
                BROWSERSTACK_USERNAME: $(BROWSERSTACK_USERNAME)
                BROWSERSTACK_ACCESS_KEY: $(BROWSERSTACK_ACCESS_KEY)

          # Stage the report as an immutable pipeline artifact. The upload
          # itself happens in PublishReports, which holds the deployment token
          # but never runs repository or test code.
          - template: templates/stage-upload.yml
            parameters:
                sourceDir: "packages/tools/tests/playwright-report"
                fallbackDir: "playwright-report"
                artifact: "browser-test-report-webgpuplaywright"
                validatePublicReport: true
                displayName: "Stage nightly WebGPU report"
                condition: "failed()"
                continueOnError: true

          - bash: |
                echo "##[section]Nightly Chrome WebGPU report URL"
                echo "  $SNAPSHOT_CDN_URL/$NIGHTLY_REPORT_ROOT/webgpuplaywright/index.html"
            displayName: "Log nightly WebGPU report URL"
            condition: failed()
            env:
                SNAPSHOT_CDN_URL: $(SNAPSHOT_CDN_URL)
                NIGHTLY_REPORT_ROOT: $(NightlyReportRoot)

          - task: PublishTestResults@2
            displayName: "Publish Test Results"
            condition: succeededOrFailed()
            inputs:
                testResultsFormat: JUnit
                testResultsFiles: "./packages/tools/tests/junit.xml"
                testRunTitle: "Nightly Chrome WebGPU ALL"

    # ============================================================================
    # NIGHTLY ES6 VISUALIZATION RUN
    #
    # Moved here from the ci-monorepo pipeline. That pipeline is compiled from
    # pull request branches, so it must not be able to request the
    # Browserstack-Opensource group at all - gating the step on
    # `Build.Reason != PullRequest` was not enough, because a pull request can
    # delete the gate. Here the pipeline has no pull request trigger, the job
    # asserts a trusted ref before doing anything, and the code under test is
    # therefore always merged master code.
    # ============================================================================
    - job: ES6Visualization
      displayName: "ES6 visualization tests"
      condition: eq(variables['Build.CronSchedule.DisplayName'], 'Nightly browser testing')
      timeoutInMinutes: 90
      variables:
          # Job-scoped: only the jobs that drive BrowserStack can see these.
          - group: Browserstack-Opensource
      steps:
          - template: templates/assert-trusted-source.yml

          - checkout: self
            clean: true
            fetchTags: false
            persistCredentials: false

          - task: UseNode@1
            displayName: "Use Node 24.x"
            inputs:
                version: "24.x"

          - script: npm ci
            displayName: "npm ci"
            env:
                PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
                PUPPETEER_SKIP_DOWNLOAD: "true"

          - bash: |
                npm run build:assets:smart-filters && npm run build:es6:libs
            displayName: "npm build es6 libs"

          - bash: .azure-pipelines/browserstack-wait.sh npx playwright test --config ./playwright.browserstack.config.ts
            displayName: "ES6 visualization tests (BrowserStack)"
            env:
                CI: "true"
                BSTACK_TEST_TYPE: "es6vis"
                BSTACK_BUILD_NAME: "ES6 Visualization Tests"
                BROWSERSTACK_LOCAL: "true"
                BROWSERSTACK_LOCAL_IDENTIFIER: "es6vis-$(Build.BuildId)-$(System.JobAttempt)"
                BROWSERSTACK_USERNAME: $(BROWSERSTACK_USERNAME)
                BROWSERSTACK_ACCESS_KEY: $(BROWSERSTACK_ACCESS_KEY)

          - template: templates/stage-upload.yml
            parameters:
                sourceDir: "packages/tools/tests/playwright-report"
                fallbackDir: "playwright-report"
                artifact: "browser-test-report-es6visplaywright"
                validatePublicReport: true
                displayName: "Stage nightly ES6 visualization report"
                condition: "failed()"
                continueOnError: true

          - bash: |
                echo "##[section]Nightly ES6 visualization report URL"
                echo "  $SNAPSHOT_CDN_URL/$NIGHTLY_REPORT_ROOT/es6visplaywright/index.html"
            displayName: "Log nightly ES6 visualization report URL"
            condition: failed()
            env:
                SNAPSHOT_CDN_URL: $(SNAPSHOT_CDN_URL)
                NIGHTLY_REPORT_ROOT: $(NightlyReportRoot)

          - task: PublishTestResults@2
            displayName: "Publish Test Results"
            condition: succeededOrFailed()
            inputs:
                testResultsFormat: JUnit
                testResultsFiles: "./junit.xml"
                testRunTitle: "Nightly ES6 visualization"

    # ============================================================================
    # COMPILE WITH CLOSURE
    # Builds UMD with ES2020 target and validates with Google Closure Compiler
    # ============================================================================
    - job: ClosureCompile
      displayName: "Compile with closure"
      steps:
          - checkout: self
            clean: true
            fetchTags: false
            persistCredentials: false

          - task: UseNode@1
            displayName: "Use Node 24.x"
            inputs:
                version: "24.x"

          - task: JavaToolInstaller@0
            displayName: "Use Java 21"
            inputs:
                versionSpec: "21"
                jdkArchitectureOption: x64
                jdkSourceOption: PreInstalled

          - script: |
                npm ci
                npm install --no-save --package-lock=false google-closure-compiler
            displayName: "npm ci and install Closure Compiler"
            env:
                PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
                PUPPETEER_SKIP_DOWNLOAD: "true"

          - script: |
                sed -i 's/ES5/ES2020/g' ./packages/public/umd/babylonjs/tsconfig.build.json
                sed -i 's/ES5/ES2020/g' ./packages/public/umd/babylonjs-loaders/tsconfig.build.json
                sed -i 's/ES5/ES2020/g' ./packages/public/umd/babylonjs-serializers/tsconfig.build.json
            displayName: "change to ES2020"

          - task: Npm@1
            displayName: "build"
            inputs:
                command: custom
                customCommand: "run build:umd"

          - script: npx google-closure-compiler --js ./packages/public/umd/babylonjs/babylon.max.js --js_output_file file.out.js
            displayName: "Test core"

          - script: npx google-closure-compiler --js ./packages/public/umd/babylonjs-loaders/babylonjs.loaders.js --js_output_file loaders.out.js
            displayName: "Test loaders"

          - script: npx google-closure-compiler --js ./packages/public/umd/babylonjs-serializers/babylonjs.serializers.js --js_output_file serializers.out.js
            displayName: "Test serializers"

    # ============================================================================
    # WEEKLY PERFORMANCE TESTS (Saturday)
    # Runs ALL visualization tests (WebGL2 and WebGPU) as a single performance job.
    # Compares the two most recent stable @babylonjs/core releases from npm,
    # e.g. 9.12.0 (baseline) vs 9.13.0 (candidate).
    # Uses all available BrowserStack parallel agents.
    # Job timeout is set to 120 minutes to accommodate the full suite.
    # ============================================================================
    - job: ResolvePerfVersions
      displayName: "Resolve perf versions"
      condition: eq(variables['Build.CronSchedule.DisplayName'], 'Weekly performance tests')
      steps:
          - bash: |
                # Resolve baseline and candidate versions for weekly perf comparison.
                # Candidate = current latest stable release.
                # Baseline  = the latest stable release that was published BEFORE the
                #             last weekly run (~7 days ago). This ensures no releases
                #             are skipped even if multiple versions shipped in one week.
                VERSIONS=$(node -e "
                  const { execSync } = require('child_process');
                  const allVersions = JSON.parse(execSync('npm view @babylonjs/core versions --json', { encoding: 'utf8' }));
                  const timeData = JSON.parse(execSync('npm view @babylonjs/core time --json', { encoding: 'utf8' }));
                  const stable = allVersions.filter(v => !v.includes('-'));
                  const candidate = stable[stable.length - 1];
                  // Find the latest stable version published before 7 days ago
                  const cutoff = Date.now() - 7 * 24 * 60 * 60 * 1000;
                  const olderStable = stable.filter(v => new Date(timeData[v]).getTime() < cutoff && v !== candidate);
                  const baseline = olderStable.length > 0 ? olderStable[olderStable.length - 1] : stable[stable.length - 2];
                  console.log(baseline + ' ' + candidate);
                ")
                PREV=$(echo "$VERSIONS" | awk '{print $1}')
                CURR=$(echo "$VERSIONS" | awk '{print $2}')
                echo "Baseline (published before last run): $PREV"
                echo "Candidate (current latest): $CURR"
                echo "##vso[task.setvariable variable=PERF_CDN_BASELINE;isOutput=true]$PREV"
                echo "##vso[task.setvariable variable=PERF_CDN_CANDIDATE;isOutput=true]$CURR"
            name: ResolveVersions
            displayName: "Resolve perf comparison versions"

    - job: WeeklyPerfAll
      displayName: "Weekly perf - all tests"
      dependsOn: ResolvePerfVersions
      condition: and(succeeded(), eq(variables['Build.CronSchedule.DisplayName'], 'Weekly performance tests'))
      timeoutInMinutes: 120
      variables:
          # Job-scoped: only the jobs that drive BrowserStack can see these.
          - group: Browserstack-Opensource
          - name: PERF_CDN_BASELINE
            value: $[ dependencies.ResolvePerfVersions.outputs['ResolveVersions.PERF_CDN_BASELINE'] ]
          - name: PERF_CDN_CANDIDATE
            value: $[ dependencies.ResolvePerfVersions.outputs['ResolveVersions.PERF_CDN_CANDIDATE'] ]
      steps:
          - template: templates/assert-trusted-source.yml

          - checkout: self
            clean: true
            fetchTags: false
            persistCredentials: false

          - task: UseNode@1
            displayName: "Use Node 24.x"
            inputs:
                version: "24.x"

          - script: npm ci
            displayName: "npm ci"
            env:
                PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
                PUPPETEER_SKIP_DOWNLOAD: "true"

          - bash: |
                set +e
                echo "Baseline: $CDN_VERSION, Candidate: $CDN_VERSION_B"
                .azure-pipelines/browserstack-wait.sh npx playwright test --config ./playwright.browserstack.config.ts
                EXIT=$?
                if [ $EXIT -ne 0 ]; then
                  echo "##vso[task.setvariable variable=PerfTestsFailed]true"
                else
                  echo "##vso[task.setvariable variable=PerfTestsFailed]false"
                fi
                exit 0
            displayName: "Performance - ALL (BStack)"
            continueOnError: true
            env:
                CDN_BASE_URL: "https://cdn.babylonjs.com"
                CI: "true"
                BSTACK_TEST_TYPE: "performance"
                BSTACK_BUILD_NAME: "Weekly Perf - ALL ($(PERF_CDN_BASELINE) vs $(PERF_CDN_CANDIDATE))"
                VISUALIZATION_PERF: "true"
                VISUALIZATION_PERF_ALL: "true"
                CDN_VERSION: $(PERF_CDN_BASELINE)
                CDN_VERSION_B: $(PERF_CDN_CANDIDATE)
                TIMEOUT: "300000"
                BSTACK_SESSIONS_REQUIRED: "5"
                BSTACK_SESSIONS_MIN: "3"
                BROWSERSTACK_USERNAME: $(BROWSERSTACK_USERNAME)
                BROWSERSTACK_ACCESS_KEY: $(BROWSERSTACK_ACCESS_KEY)

          # Stage the report as an immutable pipeline artifact. The upload
          # itself happens in PublishReports, which holds the deployment token
          # but never runs repository or test code.
          - template: templates/stage-upload.yml
            parameters:
                sourceDir: "packages/tools/tests/playwright-report"
                fallbackDir: "playwright-report"
                artifact: "browser-test-report-perfplaywright"
                validatePublicReport: true
                displayName: "Stage weekly perf report"
                condition: "eq(variables['PerfTestsFailed'], 'true')"
                continueOnError: true

          - bash: |
                echo "##[section]Weekly Perf report URL"
                echo "  $SNAPSHOT_CDN_URL/$NIGHTLY_REPORT_ROOT/perfplaywright/index.html"
            displayName: "Log weekly perf report URL"
            condition: eq(variables['PerfTestsFailed'], 'true')
            env:
                SNAPSHOT_CDN_URL: $(SNAPSHOT_CDN_URL)
                NIGHTLY_REPORT_ROOT: $(NightlyReportRoot)

          - task: PublishTestResults@2
            displayName: "Publish perf test results"
            condition: succeededOrFailed()
            inputs:
                testResultsFormat: JUnit
                testResultsFiles: "junit.xml"
                testRunTitle: "Weekly Perf - ALL"

    # =========================================================================
    # Publish the staged reports.
    #
    # Fresh agent, `checkout: none`, no npm install and no test code. This is
    # the only job in the pipeline that holds DEPLOY_TOKEN. Reports staged by
    # the test jobs are uploaded verbatim; jobs that staged nothing are skipped
    # by the publisher itself.
    # =========================================================================
    - template: templates/publish-uploads-job.yml
      parameters:
          jobName: PublishReports
          displayName: "Publish browser test reports"
          dependsOn:
              - WebkitWebGL2
              - FirefoxWebGL2
              - ChromeWebGL2Full
              - ChromeWebGPUFull
              - ES6Visualization
              - WeeklyPerfAll
          condition: always()
          requireTrustedSource: true
          variables:
              - group: BabylonJS-Deployment
          uploads:
              - artifact: "browser-test-report-webkitplaywright"
                destination: "$(NightlyReportRoot)/webkitplaywright"
                deleteStale: true
                extraFields: []
                displayName: "Upload nightly Webkit report"
              - artifact: "browser-test-report-firefoxplaywright"
                destination: "$(NightlyReportRoot)/firefoxplaywright"
