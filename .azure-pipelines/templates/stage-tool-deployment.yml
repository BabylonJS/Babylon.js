# =============================================================================
# Template: Stage a tool's dist + public directories for a trusted deployment
#           (CREDENTIAL-FREE)
#
# Credential-free replacement for the former templates/deploy-tool.yml (now
# removed). It merges a tool's
# `dist/` and `public/` directories into a single archive and publishes it as an
# immutable pipeline artifact. No deployment token is present in the job, so a
# malicious pull request cannot steal or misuse it.
#
# The upload itself, and any CDN purge, are performed later by a job created
# from templates/publish-uploads-job.yml, which runs with `checkout: none`.
#
# Merge order matches the upload order of the removed deploy-tool.yml: `dist/` is
# copied first and `public/` second, so on a name collision the `public/` copy
# wins, exactly as it did when the two archives were uploaded in sequence.
# =============================================================================

parameters:
    # Relative path from repo root, e.g. 'packages/tools/playground'.
    - name: toolPackageDir
      type: string
    # Pipeline artifact name; must match the consuming publish job.
    - name: artifact
      type: string
    - name: displayName
      type: string
      default: "Stage tool deployment"

steps:
    - script: |
          set -euo pipefail

          STAGE_DIR="$ARTIFACT_STAGING_DIRECTORY/staged-uploads/$ARTIFACT_NAME"
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR"

          MERGE_DIR=$(mktemp -d)
          trap 'rm -rf "$MERGE_DIR"' EXIT

          cp -R "$TOOL_PACKAGE_DIR/dist/." "$MERGE_DIR/"
          cp -R "$TOOL_PACKAGE_DIR/public/." "$MERGE_DIR/"

          ( cd "$MERGE_DIR" && zip -q -r "$STAGE_DIR/payload.zip" . )
          echo "present" > "$STAGE_DIR/status.txt"
      displayName: "${{ parameters.displayName }}"
      env:
          # Caller-supplied values and Azure metadata are data, never script
          # text: see .azure-pipelines/templates/assert-trusted-source.yml.
          ARTIFACT_NAME: ${{ parameters.artifact }}
          TOOL_PACKAGE_DIR: ${{ parameters.toolPackageDir }}
          ARTIFACT_STAGING_DIRECTORY: $(Build.ArtifactStagingDirectory)

    - task: PublishPipelineArtifact@1
      displayName: "${{ parameters.displayName }} (publish artifact)"
      inputs:
          targetPath: "$(Build.ArtifactStagingDirectory)/staged-uploads/${{ parameters.artifact }}"
          artifact: "${{ parameters.artifact }}"
          publishLocation: "pipeline"
