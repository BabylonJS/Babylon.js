# =============================================================================
# Template: Fail closed when a protected secret did not come from its group
#
# The release credentials are no longer pipeline-UI secret variables. A UI
# secret variable is not a protected resource: it has no pipeline permissions,
# no branch control check and no required-template check, so it is handed to
# every run of the definition - including a run queued against an arbitrary ref
# whose YAML the queuer wrote. Both credentials therefore live in dedicated
# variable groups, which *are* protected resources.
#
# A missing or unauthorized variable group must never degrade into "the step
# ran with an empty token and skipped the work". Two failure shapes are
# possible and both are caught here:
#
#   * the group is authorized but the variable is absent - the macro expands to
#     the empty string;
#   * the macro names a variable that does not exist at all - Azure Pipelines
#     leaves the macro text `$(NAME)` in place, so the step would receive the
#     literal string as its "token".
#
# The expected literal is *rebuilt* from the variable's name rather than
# written out, because a credentialed script body may not contain a `$( )`
# macro at all: it is a textual substitution performed before the script runs,
# and .azure-pipelines/scripts/validate-pipeline-trust-boundary.mjs rejects it.
#
# The value itself is never printed, compared with `echo`, or written anywhere.
# =============================================================================

parameters:
    # Name of the variable inside the protected group, e.g. GITHUB_RELEASE_TOKEN.
    - name: variableName
      type: string
    # Variable group that must supply it, named only for the error message.
    - name: variableGroup
      type: string
    # The value, passed by the caller as a macro so it arrives through `env:`.
    - name: value
      type: string
    - name: displayName
      type: string
      default: "Assert protected secret is present"

steps:
    - bash: |
          set -euo pipefail

          SECRET_VALUE="${SECRET_VALUE:-}"
          SECRET_NAME="${SECRET_NAME:-}"
          SECRET_GROUP="${SECRET_GROUP:-}"

          if [ -z "$SECRET_NAME" ] || [ -z "$SECRET_GROUP" ]; then
              echo "##vso[task.logissue type=error]Secret preflight is missing its inputs"
              exit 1
          fi

          # Rebuilt, never written literally: a credentialed script body may not
          # contain an Azure macro, so the marker is assembled from the name.
          UNEXPANDED_MARKER="\$($SECRET_NAME)"

          if [ -z "$SECRET_VALUE" ]; then
              echo "##vso[task.logissue type=error]$SECRET_NAME is empty. Create it in the protected variable group '$SECRET_GROUP' and authorize that group for this pipeline."
              exit 1
          fi

          if [ "$SECRET_VALUE" = "$UNEXPANDED_MARKER" ]; then
              echo "##vso[task.logissue type=error]$SECRET_NAME did not expand, so the variable group '$SECRET_GROUP' is not linked to this job. Refusing to continue."
              exit 1
          fi

          echo "$SECRET_NAME was supplied by a protected variable group."
      displayName: "${{ parameters.displayName }}"
      env:
          SECRET_VALUE: ${{ parameters.value }}
          SECRET_NAME: ${{ parameters.variableName }}
          SECRET_GROUP: ${{ parameters.variableGroup }}
