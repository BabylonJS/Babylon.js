# =============================================================================
# Template: Stage a payload for a later, trusted upload (CREDENTIAL-FREE)
#
# This template is the pull-request side of the CI trust boundary. It runs in
# jobs that build and execute pull-request-controlled code (npm lifecycle
# scripts, Playwright specs, build scripts), so it must never be given a
# credential of any kind:
#
#   * no deployment token
#   * no GitHub service connection
#   * no BrowserStack credentials
#
# All it does is validate and zip a directory and hand the archive to Azure
# Pipelines as an immutable pipeline artifact. A separate job - created from
# templates/publish-uploads-job.yml, running with `checkout: none` so no
# pull-request code is ever present on its agent - downloads that artifact and
# performs the authenticated upload to a destination that is hard-coded in
# trusted YAML.
#
# Consequences of that split:
#   * A malicious pull request cannot read the deployment token, because the
#     token is never present in this job.
#   * A malicious pull request cannot redirect an upload, because the
#     destination is not carried in the artifact - the trusted job supplies it.
#   * `##vso[task.setvariable ...]` emitted by pull-request code cannot reach
#     the uploading job: task variables do not cross job boundaries unless they
#     are explicitly declared as output variables and mapped by the consumer.
# =============================================================================

parameters:
    # Directory to archive, relative to the repository root.
    - name: sourceDir
      type: string
    # Optional second location to try when `sourceDir` is absent.
    - name: fallbackDir
      type: string
      default: ""
    # Pipeline artifact name. Must be unique within the pipeline run, and must
    # match the `artifact` value used by the consuming publish job.
    - name: artifact
      type: string
    # Run the public-report sanitizer before archiving. Used for Playwright
    # reports, which are generated by pull-request-controlled test code and are
    # published to a public CDN.
    - name: validatePublicReport
      type: boolean
      default: false
    - name: displayName
      type: string
      default: "Stage upload payload"
    - name: condition
      type: string
      default: "succeededOrFailed()"
    - name: continueOnError
      type: boolean
      default: false

steps:
    - script: |
          set -euo pipefail

          STAGE_DIR="$(Build.ArtifactStagingDirectory)/staged-uploads/${{ parameters.artifact }}"
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR"

          SOURCE_DIR="${{ parameters.sourceDir }}"
          FALLBACK_DIR="${{ parameters.fallbackDir }}"

          if test -d "$SOURCE_DIR"; then
            SELECTED_DIR="$SOURCE_DIR"
          elif [ -n "$FALLBACK_DIR" ] && test -d "$FALLBACK_DIR"; then
            SELECTED_DIR="$FALLBACK_DIR"
          else
            # Nothing to publish. Still emit the marker so the artifact exists
            # and the trusted publish job can distinguish "no payload" from
            # "the producing job never ran".
            echo "No source directory found for '${{ parameters.artifact }}', nothing to stage"
            echo "absent" > "$STAGE_DIR/status.txt"
            exit 0
          fi

          if [ "${{ parameters.validatePublicReport }}" = "True" ] || [ "${{ parameters.validatePublicReport }}" = "true" ]; then
            node "$(Build.SourcesDirectory)/.azure-pipelines/scripts/validate-public-report.mjs" "$SELECTED_DIR"
          fi

          ( cd "$SELECTED_DIR" && zip -q -r "$STAGE_DIR/payload.zip" . )
          echo "present" > "$STAGE_DIR/status.txt"
          echo "Staged $SELECTED_DIR as artifact '${{ parameters.artifact }}'"
      displayName: "${{ parameters.displayName }}"
      condition: ${{ parameters.condition }}
      continueOnError: ${{ parameters.continueOnError }}

    - task: PublishPipelineArtifact@1
      displayName: "${{ parameters.displayName }} (publish artifact)"
      condition: ${{ parameters.condition }}
      continueOnError: ${{ parameters.continueOnError }}
      inputs:
          targetPath: "$(Build.ArtifactStagingDirectory)/staged-uploads/${{ parameters.artifact }}"
          artifact: "${{ parameters.artifact }}"
          publishLocation: "pipeline"
