# =============================================================================
# Template: Pipeline caches (npm / Playwright)
#
# Emits Cache@2 restore+save steps. Insert this immediately BEFORE the job's
# `npm ci` step so the npm download cache is restored first.
#
# Uses these pipeline-level cache path variables (see ci-monorepo.yml):
#   - npm_config_cache          e.g. $(Pipeline.Workspace)/.npm
#   - NX_CACHE_DIRECTORY        e.g. $(Pipeline.Workspace)/.nxcache (job-local)
#   - PLAYWRIGHT_BROWSERS_PATH  e.g. $(Pipeline.Workspace)/.playwright
#
# Cache keys:
#   - npm:        keyed on package-lock.json (hits until dependencies change).
#   - playwright: keyed on OS, distro/version, architecture, and package-lock.json.
#     Browser revisions share directory names across Linux distros despite
#     requiring different system libraries, so restore prefixes must also be
#     platform-specific. The v2 namespace excludes old cross-distro caches.
#
# Nx's database cache is intentionally not persisted with Cache@2. Its metadata
# is machine-specific and stored outside NX_CACHE_DIRECTORY, so restoring only
# the artifacts on a new hosted agent makes them unrecognized and unprunable.
# Nx still uses its bounded local cache within each job.
# =============================================================================

parameters:
    - name: playwright
      type: boolean
      default: false

steps:
    # Reclaim disk space first. On Microsoft-hosted Linux agents the OS disk can
    # already be >95% full before any cache is written (unused preinstalled
    # toolchains + full-history checkout), which makes the Cache@2 tar writes
    # below fail with "No space left on device". Freeing space up front is what
    # keeps the caches and build outputs from overflowing `/`.
    - template: free-disk-space.yml

    - task: Cache@2
      displayName: "Cache npm packages"
      inputs:
          key: 'npm | "$(Agent.OS)" | package-lock.json'
          restoreKeys: |
              npm | "$(Agent.OS)"
          path: $(npm_config_cache)

    - ${{ if eq(parameters.playwright, true) }}:
          - bash: |
                set -euo pipefail
                . /etc/os-release
                echo "##vso[task.setvariable variable=PLAYWRIGHT_CACHE_PLATFORM]${ID:?}-${VERSION_ID:?}-$(uname -m)"
            displayName: "Identify Playwright cache platform"

          - task: Cache@2
            displayName: "Cache Playwright browsers"
            inputs:
                key: 'playwright-v2 | "$(Agent.OS)" | "$(PLAYWRIGHT_CACHE_PLATFORM)" | package-lock.json'
                restoreKeys: |
                    playwright-v2 | "$(Agent.OS)" | "$(PLAYWRIGHT_CACHE_PLATFORM)"
                path: $(PLAYWRIGHT_BROWSERS_PATH)

    # Guarantee the cache paths exist so the automatic post-job save never
    # fails on a missing directory (e.g. a job whose tool wrote nothing, or a
    # tool that hasn't created its dir yet). NX_CACHE_DIRECTORY is created for
    # the job-local Nx cache; it is not persisted by this template.
    - bash: |
          mkdir -p "$(npm_config_cache)" "$(NX_CACHE_DIRECTORY)" "$(PLAYWRIGHT_BROWSERS_PATH)"
      displayName: "Ensure cache directories exist"
