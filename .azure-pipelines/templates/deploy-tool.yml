# =============================================================================
# Template: Deploy a tool's dist + public directories to the deployment server
#
# Zips the dist/ and public/ directories of a tool package, uploads both
# to the deployment server, and optionally purges a CDN endpoint.
#
# TRUSTED PIPELINES ONLY. This template maps the deployment token into a step
# that runs in the calling job. It must only be used from pipelines that never
# build pull-request code (`pr: none`), such as cd-tools.yml and
# ci-browser-testing.yml. Pull-request-triggered pipelines stage their payload
# with templates/stage-upload.yml and upload it from a separate, trusted
# `checkout: none` job created by templates/publish-uploads-job.yml.
# =============================================================================

parameters:
    - name: toolPackageDir
      type: string # relative path from repo root, e.g. 'packages/tools/playground'
    - name: deployPath
      type: string # server path, e.g. 'PLAYGROUND/$(BuildName)' or 'sandbox'
    - name: storageAccount
      type: string
      default: "$(SNAPSHOTS_STORAGE_ACCOUNT)"
    - name: displayName
      type: string
      default: "Deploy tool"
    - name: purgeEndpoint
      type: string
      default: ""
    - name: purgeProfile
      type: string
      default: ""

steps:
    - script: |
          curlAuth() { printf 'header = "Authorization: %s"\n' "$DEPLOY_TOKEN" | curl --config - "$@"; }
          set -euo pipefail

          cd ${{ parameters.toolPackageDir }}/dist
          zip -r $(Build.SourcesDirectory)/_deploy_dist.zip *
          cd $(Build.SourcesDirectory)

          cd ${{ parameters.toolPackageDir }}/public
          zip -r $(Build.SourcesDirectory)/_deploy_public.zip *
          cd $(Build.SourcesDirectory)

          curlAuth --fail-with-body --silent --show-error $(DEPLOYMENT_SERVER)/$(DEPLOY_ENDPOINT_UPLOAD) -i -X POST \
            -H "Content-Type: multipart/form-data" \
            -F "path=${{ parameters.deployPath }}" \
            -F "storageAccount=${{ parameters.storageAccount }}" \
            -F "zip=@_deploy_dist.zip"

          curlAuth --fail-with-body --silent --show-error $(DEPLOYMENT_SERVER)/$(DEPLOY_ENDPOINT_UPLOAD) -i -X POST \
            -H "Content-Type: multipart/form-data" \
            -F "path=${{ parameters.deployPath }}" \
            -F "storageAccount=${{ parameters.storageAccount }}" \
            -F "zip=@_deploy_public.zip"

          rm -f _deploy_dist.zip _deploy_public.zip
      displayName: "${{ parameters.displayName }}"
      env:
          DEPLOY_TOKEN: $(DEPLOY_TOKEN)

    - ${{ if ne(parameters.purgeEndpoint, '') }}:
          - script: |
                curlAuth() { printf 'header = "Authorization: %s"\n' "$DEPLOY_TOKEN" | curl --config - "$@"; }
                # Async purge: don't wait for the CDN to finish purging.
                # The deployment server has a much shorter timeout than Azure's
                # purge operation, so blocking on it always times out in CI.
                curlAuth --fail-with-body --silent --show-error "$(DEPLOYMENT_SERVER)/$(DEPLOY_ENDPOINT_PURGE)?endpoint=${{ parameters.purgeEndpoint }}&profileName=${{ parameters.purgeProfile }}&wait=false" -i -X POST
            displayName: "Purge CDN (${{ parameters.purgeEndpoint }})"
            env:
                DEPLOY_TOKEN: $(DEPLOY_TOKEN)
