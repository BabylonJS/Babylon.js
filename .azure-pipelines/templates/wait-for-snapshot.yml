# =============================================================================
# Template: Wait for a Babylon snapshot to become available
#
# Polls a snapshot's source-version marker until it matches the current build.
# Used by PR pipelines that depend on the main CI snapshot being deployed.
# =============================================================================

parameters:
    - name: sourceVersionUrl
      type: string
      default: "$(SNAPSHOT_CDN_URL)/$(BuildName)/build-source-version.txt"
    - name: timeoutMinutes
      type: number
      default: 30
    - name: displayName
      type: string
      default: "Wait for Babylon snapshot"

steps:
    - script: |
          set -euo pipefail

          expectedVersion="$(Build.SourceVersion)"
          deadline=$((SECONDS + ${{ parameters.timeoutMinutes }} * 60 - 10))

          while (( SECONDS < deadline )); do
              if actualVersion=$(curl \
                  --connect-timeout 5 \
                  --max-time 10 \
                  --fail \
                  --silent \
                  --show-error \
                  '${{ parameters.sourceVersionUrl }}'); then
                  if [[ "$actualVersion" == "$expectedVersion" ]]; then
                      echo "Babylon snapshot is ready for $expectedVersion"
                      exit 0
                  fi

                  echo "Snapshot is for ${actualVersion:-an unknown version}; waiting for $expectedVersion"
              fi

              sleep 20
          done

          echo "Timed out waiting for Babylon snapshot for $expectedVersion" >&2
          exit 1
      displayName: "${{ parameters.displayName }}"
      timeoutInMinutes: ${{ parameters.timeoutMinutes }}
