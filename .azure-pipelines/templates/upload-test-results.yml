# =============================================================================
# Template: Upload Playwright test results to the deployment server
#
# Looks for a sanitized public report directory, validates its contents, zips
# it, and uploads it to the deployment server. Supports a fallback directory
# for cases where the report may be in a different location.
#
# This step must not be given any credential beyond the deployment token it
# actually uses - it runs right after PR-controlled test code, so every extra
# secret mapped into its environment would be needlessly reachable.
#
# TRUSTED PIPELINES ONLY. This template maps the deployment token into a step
# that runs in the calling job. It must only be used from pipelines that never
# build pull-request code (`pr: none`), such as cd-tools.yml and
# ci-browser-testing.yml. Pull-request-triggered pipelines stage their payload
# with templates/stage-upload.yml and upload it from a separate, trusted
# `checkout: none` job created by templates/publish-uploads-job.yml.
# =============================================================================

parameters:
    - name: reportDir
      type: string
      default: "playwright-report"
    - name: fallbackReportDir
      type: string
      default: ""
    - name: deployPath
      type: string
    - name: storageAccount
      type: string
      default: "$(SNAPSHOTS_STORAGE_ACCOUNT)"
    - name: displayName
      type: string
      default: "Upload test results"
    - name: condition
      type: string
      default: "succeededOrFailed()"
    - name: continueOnError
      type: boolean
      default: false

steps:
    - script: |
          curlAuth() { printf 'header = "Authorization: %s"\n' "$DEPLOY_TOKEN" | curl --config - "$@"; }
          set -euo pipefail

          REPORT_DIR="${{ parameters.reportDir }}"
          FALLBACK_DIR="${{ parameters.fallbackReportDir }}"

          if test -d "$REPORT_DIR"; then
            SELECTED_REPORT_DIR="$REPORT_DIR"
          elif [ -n "$FALLBACK_DIR" ] && test -d "$FALLBACK_DIR"; then
            SELECTED_REPORT_DIR="$FALLBACK_DIR"
          else
            echo "No report directory found, skipping upload"
            exit 0
          fi

          node "$(Build.SourcesDirectory)/.azure-pipelines/scripts/validate-public-report.mjs" "$SELECTED_REPORT_DIR"

          REPORT_ARCHIVE="$(Build.SourcesDirectory)/_test_report.zip"
          trap 'rm -f "$REPORT_ARCHIVE"' EXIT
          cd "$SELECTED_REPORT_DIR"
          zip -q -r "$REPORT_ARCHIVE" .
          cd "$(Build.SourcesDirectory)"

          curlAuth --fail-with-body --silent --show-error "$(DEPLOYMENT_SERVER)/$(DEPLOY_ENDPOINT_UPLOAD)" -X POST \
            -H "Content-Type: multipart/form-data" \
            -F "path=${{ parameters.deployPath }}" \
            -F "storageAccount=${{ parameters.storageAccount }}" \
            -F "zip=@$REPORT_ARCHIVE"
      displayName: "${{ parameters.displayName }}"
      condition: ${{ parameters.condition }}
      continueOnError: ${{ parameters.continueOnError }}
      env:
          DEPLOY_TOKEN: $(DEPLOY_TOKEN)
