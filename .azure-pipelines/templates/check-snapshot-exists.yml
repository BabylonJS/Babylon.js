# =============================================================================
# Template: Check if a snapshot exists on the deployment server
#
# Queries the deployment server for a snapshot path and sets a pipeline
# variable (default: SnapshotExists) to 'true' or 'false'.
#
# TRUSTED PIPELINES ONLY. This template maps the deployment token into a step
# that runs in the calling job. It must only be used from pipelines that never
# build pull-request code (`pr: none`), such as cd-tools.yml and
# ci-browser-testing.yml. Pull-request-triggered pipelines stage their payload
# with templates/stage-upload.yml and upload it from a separate, trusted
# `checkout: none` job created by templates/publish-uploads-job.yml.
# =============================================================================

parameters:
    - name: snapshotPath
      type: string
    - name: variableName
      type: string
      default: "SnapshotExists"
    - name: displayName
      type: string
      default: "Check if snapshot exists"

steps:
    - script: |
          curlAuth() { printf 'header = "Authorization: %s"\n' "$DEPLOY_TOKEN" | curl --config - "$@"; }
          set -euo pipefail

          HTTP_STATUS=$(curlAuth --silent --show-error \
            --output ./tmp.json \
            --write-out "%{http_code}" \
            "$(DEPLOYMENT_SERVER)/$(DEPLOY_ENDPOINT_SNAPSHOT_CHECK)?buildNumber=${{ parameters.snapshotPath }}" \
           )

          if [ "$HTTP_STATUS" = "404" ]; then
             echo "##vso[task.setvariable variable=${{ parameters.variableName }}]false"
             exit 0
          fi

          if [ "$HTTP_STATUS" != "200" ]; then
             echo "Snapshot check failed with HTTP status $HTTP_STATUS"
             exit 1
          fi

          if grep "true" ./tmp.json
          then
             echo "##vso[task.setvariable variable=${{ parameters.variableName }}]true"
          else
             echo "##vso[task.setvariable variable=${{ parameters.variableName }}]false"
          fi
      displayName: "${{ parameters.displayName }}"
      env:
          DEPLOY_TOKEN: $(DEPLOY_TOKEN)
