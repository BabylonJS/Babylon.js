# =============================================================================
# CI-Monorepo Pipeline - Babylon.js
# Converted from Azure DevOps Classic Pipeline (Definition ID: 14)
#
# IMPORTANT SETUP NOTES:
# 1. Link variable groups (see VARIABLE-GROUPS.md):
#    - BabylonJS-CI-Infrastructure
#    - Browserstack-Opensource (BROWSERSTACK_ACCESS_KEY, BROWSERSTACK_USERNAME)
#    - BabylonJS-Deployment (DEPLOY_TOKEN, DEPLOYMENT_SERVER)
#
# 2. Fork build settings: "Make secrets available to builds of forks" must stay
#    DISABLED, and "Require a team member's comment before building a pull
#    request" must stay ENABLED, in the Azure DevOps pipeline settings UI.
#    See the "CI trust boundary" section of VARIABLE-GROUPS.md - this pipeline
#    builds, tests and executes pull-request-controlled code (npm lifecycle
#    scripts, Playwright specs, build scripts) in the same jobs that hold the
#    deployment, BrowserStack and GitHub credentials, so a fork run that was
#    granted secrets could exfiltrate all of them.
#
# 3. Authorize the GitHub service connection (GITHUB_SERVICE_CONNECTION)
#    for this pipeline. Never mark it as available to fork builds.
#
# 4. Update the 'resources.pipelines' source names to match your actual
#    pipeline names in Azure DevOps.
#
# 5. Credential hygiene enforced by this file: checkouts use
#    `persistCredentials: false` so the pipeline OAuth token never reaches
#    .git/config, secrets are mapped step-by-step (never job-wide) and only
#    into the steps that consume them, and every privileged deployment job is
#    gated on a trusted branch plus a trusted build reason.
# =============================================================================

trigger:
    batch: true
    branches:
        include:
            - master
    paths:
        exclude:
            - .build/config.json
            - CHANGELOG.md

pr:
    branches:
        include:
            - master

schedules:
    # Classic pipeline: midnight PST on Mon, Tue, Wed, Fri (daysToBuild: 23)
    # Cron is in UTC: midnight PST = 08:00 UTC
    - cron: "0 8 * * 1,2,3,5"
      displayName: Scheduled build
      branches:
          include:
              - master
      always: false # Only run if there are changes

resources:
    pipelines:
        # Build completion trigger - cd-publish pipeline (Definition 15)
        - pipeline: buildCompletionTrigger
          source: "Publish pipeline"
          trigger:
              branches:
                  include:
                      - master
        # Native tests artifact source - pipeline ID 36
        - pipeline: nativeTestsArtifact
          source: "BabylonNative Nightly CI"
          project: ContinousIntegration

variables:
    - group: BabylonJS-CI-Infrastructure
    - group: BabylonJS-Deployment
    # BrowserStack credentials are requested only for runs that are not pull
    # request validations. On a pull request this group is never linked, so the
    # secrets are not materialised in the run at all - not merely withheld from
    # individual steps. Cross-browser visualization and performance coverage
    # therefore comes from trusted (branch and scheduled) runs.
    - ${{ if ne(variables['Build.Reason'], 'PullRequest') }}:
          - group: Browserstack-Opensource
    # `readonly` so pull-request code cannot repoint upload destinations by
    # emitting `##vso[task.setvariable variable=BuildName]...`.
    - name: BuildName
      value: $(Build.SourceBranch)
      readonly: true
    - name: BROWSERSTACK_BROWSER
      value: "chrome@143:OSX Sonoma"
    - name: system.debug
      value: false
    # Stable, cacheable locations (see templates/cache-steps.yml). Kept outside
    # the repo working dir so Cache@2 can restore/save them across runs & reruns.
    - name: npm_config_cache
      value: $(Pipeline.Workspace)/.npm
    - name: NX_CACHE_DIRECTORY
      value: $(Pipeline.Workspace)/.nxcache
    # Nx 22.7.8 reads NX_MAX_CACHE_SIZE and accepts B/KB/MB/GB values. Cache@2
    # creates an uncompressed tar alongside the cache, so cap the source
    # directory to leave enough disk headroom for that temporary archive.
    - name: NX_MAX_CACHE_SIZE
      value: 4GB
    - name: PLAYWRIGHT_BROWSERS_PATH
      value: $(Pipeline.Workspace)/.playwright
    # Cache location for the pinned Khronos KHR_interactivity conformance assets.
    - name: KHR_ASSETS_CACHE
      value: $(Pipeline.Workspace)/.khr-interactivity-assets

pool:
    vmImage: ubuntu-latest

jobs:
    # ============================================================================
    # BUILD JOB
    # Builds UMD packages, prepares and uploads snapshot, posts PR comments
    # No dependencies - runs immediately
    # ============================================================================
    - job: Build
      displayName: "Build job"
      steps:
          - template: templates/checkout-with-tag-override.yml
            parameters:
                fetchDepth: 0

          - task: UseNode@1
            displayName: "Use Node 24.x"
            continueOnError: true
            retryCountOnTaskFailure: 1
            inputs:
                version: "24.x"

          - bash: |
                # Exposed as output variables so the trusted comment job can read
                # them without ever checking out pull-request code.
                git diff --name-status $(git rev-parse origin/master) $(git rev-parse HEAD) | grep -q "what's new.md" && echo "##vso[task.setvariable variable=WhatsNewChanged;isOutput=true]true"
                git diff --name-status $(git rev-parse origin/master) $(git rev-parse HEAD) | grep -q "package.json" && echo "##vso[task.setvariable variable=PackageJsonChanged;isOutput=true]true"
                git diff --name-status $(git rev-parse origin/master) $(git rev-parse HEAD) | grep -q ".build/config.json" && echo "##vso[task.setvariable variable=ConfigJsonChanged;isOutput=true]true"
                git diff --name-status $(git rev-parse origin/master) $(git rev-parse HEAD) | grep -q "smartFilter" && { echo "##vso[task.setvariable variable=SmartFiltersChanged;isOutput=true]true"; echo "##vso[task.setvariable variable=SmartFiltersChanged]true"; }

                git diff --name-status $(git rev-parse origin/master) $(git rev-parse HEAD)
            name: GitChanges
            displayName: "Check git changes"
            continueOnError: true

          - bash: |
                # For scheduled/build-completion runs, run ALL visualization tests.
                # For PR/push runs, compute affected tags from the diff.
                if [ "$(Build.Reason)" = "Schedule" ] || [ "$(Build.Reason)" = "BuildCompletion" ]; then
                    TAGS="ALL"
                    echo "Scheduled/publish run — running ALL visualization tests"
                else
                    TAGS=$(node scripts/compute-affected-vis-tags.mjs)
                fi
                echo "Affected vis-test tags: $TAGS"
                echo "##vso[task.setvariable variable=AFFECTED_TAGS;isOutput=true]$TAGS"
            name: ComputeVisTags
            displayName: "Compute affected vis-test tags"
            continueOnError: true

          - template: templates/cache-steps.yml
            parameters:
                nx: true
                nxCacheKey: build

          - script: npm ci
            displayName: "npm ci"
            retryCountOnTaskFailure: 1
            env:
                PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
                PUPPETEER_SKIP_DOWNLOAD: "true"

          - task: Npm@1
            displayName: "npm build umd"
            inputs:
                command: custom
                customCommand: "run build:umd"

          - task: Npm@1
            displayName: "npm build smart filters"
            condition: and(succeeded(), eq(variables['SMARTFILTERSCHANGED'], 'true'))
            inputs:
                command: custom
                customCommand: "run build:source:smart-filters"

          - task: Npm@1
            displayName: "npm build smart filters editor"
            condition: and(succeeded(), eq(variables['SMARTFILTERSCHANGED'], 'true'))
            inputs:
                command: custom
                customCommand: "run build:deployment -w @tools/smart-filters-editor"

          - task: Npm@1
            displayName: "Prepare snapshot"
            inputs:
                command: custom
                customCommand: "run prepare-snapshot"

          - task: Npm@1
            displayName: "Test es version of UMD packages"
            inputs:
                command: custom
                customCommand: "run test:escheck"

          - task: Npm@1
            displayName: "Test UMD build"
            inputs:
                command: custom
                customCommand: "run build -w babylonjs-testproject"

          - script: |
                mkdir .snapshot/smartFiltersEditor
                cp -r packages/tools/smartFiltersEditor/dist/* .snapshot/smartFiltersEditor
            displayName: "Add Smart Filters Editor to snapshot"
            condition: and(succeeded(), eq(variables['SMARTFILTERSCHANGED'], 'true'))

          # Credential-free: the snapshot is staged as a pipeline artifact and
          # uploaded later by the trusted PublishSnapshot job.
          - template: templates/stage-upload.yml
            parameters:
                sourceDir: ".snapshot"
                artifact: "buildSnapshot"
                displayName: "Stage snapshot"
                condition: succeeded()

    # ============================================================================
    # ES6 (libs + visualization)
    # Builds only the ES6 lib packages (core/gui/loaders/…) that the ES6
    # visualization tests consume, then runs those tests. The editor/tool
    # builds, tree-shaking check, and file-size report run in parallel in the
    # sibling ES6Tools job, keeping them off the visualization critical path.
    # No dependencies - runs immediately
    # ============================================================================
    - job: ES6
      displayName: "ES6 (libs + visualization)"
      steps:
          - template: templates/checkout-with-tag-override.yml

          - task: UseNode@1
            displayName: "Use Node 24.x"
            continueOnError: true
            retryCountOnTaskFailure: 1
            inputs:
                version: "24.x"

          - template: templates/cache-steps.yml
            parameters:
                nx: true
                nxCacheKey: es6

          - script: npm ci
            displayName: "npm ci"
            env:
                PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
                PUPPETEER_SKIP_DOWNLOAD: "true"

          # Only the lib packages (core/gui/loaders/…) are needed for the
          # visualization tests below. The editor/tool builds and the
          # tree-shaking check run in parallel in the ES6Tools job.
          - bash: |
                npm run build:assets:smart-filters && npm run build:es6:libs
            displayName: "npm build es6 libs"

          - bash: .azure-pipelines/browserstack-wait.sh npx playwright test --config ./playwright.browserstack.config.ts
            displayName: "ES6 visualization tests (BrowserStack)"
            condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
            env:
                CI: "true"
                BSTACK_TEST_TYPE: "es6vis"
                BSTACK_BUILD_NAME: "ES6 Visualization Tests"
                BROWSERSTACK_LOCAL: "true"
                BROWSERSTACK_LOCAL_IDENTIFIER: "es6vis-$(Build.BuildId)-$(System.JobAttempt)"
                ${{ if ne(variables['Build.Reason'], 'PullRequest') }}:
                    BROWSERSTACK_USERNAME: $(BROWSERSTACK_USERNAME)
                    BROWSERSTACK_ACCESS_KEY: $(BROWSERSTACK_ACCESS_KEY)

          # Credential-free: the report is staged as a pipeline artifact and
          # uploaded later by the trusted PublishTestReports job.
          - template: templates/stage-upload.yml
            parameters:
                sourceDir: "packages/tools/tests/playwright-report"
                fallbackDir: "playwright-report"
                artifact: "es6visReport"
                validatePublicReport: true
                displayName: "Stage ES6 visualization test results"
                continueOnError: true

          - bash: |
                echo "##[section]ES6 visualization test report URL"
                echo "  $(SNAPSHOT_CDN_URL)/$(BuildName)/testResults/es6visplaywright/index.html"
            displayName: "Log ES6 visualization test report URL"
            condition: succeededOrFailed()

          - task: PublishTestResults@2
            displayName: "Publish ES6 visualization test results"
            condition: succeededOrFailed()
            inputs:
                testResultsFormat: JUnit
                testResultsFiles: "./junit.xml"

    # ============================================================================
    # ES6 TOOLS, TREE-SHAKING, AND FILE SIZES
    # Runs the full ES6 build (editor/tool packages + check:treeshaking-all),
    # validates publishability, and generates/uploads the file-size report.
    # Split out of the ES6 job so this work runs in parallel with the ES6
    # visualization tests instead of gating them. Blocking: tree-shaking and
    # build failures fail the pipeline here just as they did in the ES6 job.
    # No dependencies - runs immediately
    # ============================================================================
    - job: ES6Tools
      displayName: "ES6 tools, tree-shaking, and file sizes"
      steps:
          - template: templates/checkout-with-tag-override.yml

          - task: UseNode@1
            displayName: "Use Node 24.x"
            continueOnError: true
            retryCountOnTaskFailure: 1
            inputs:
                version: "24.x"

          - template: templates/cache-steps.yml
            parameters:
                nx: true
                nxCacheKey: es6-tools

          - script: npm ci
            displayName: "npm ci"
            env:
                PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
                PUPPETEER_SKIP_DOWNLOAD: "true"

          - task: Npm@1
            displayName: "npm build es6"
            inputs:
                command: custom
                customCommand: "run build:es6"

          - bash: |
                npx nx run-many --target=prepublishOnly --all
            displayName: "Make sure es6 packages are ready"

          - task: Npm@1
            displayName: "Test ES6 packages"
            inputs:
                command: custom
                customCommand: "run test:es6-packages -w @tools/tests"

          - task: Npm@1
            displayName: "npm build modules size"
            inputs:
                command: custom
                customCommand: "run build -w @tools/tests"

          - task: Npm@1
            displayName: "npm generate modules size"
            inputs:
                command: custom
                customCommand: "run generate-file-size-report -w @tools/tests"

          # Credential-free: only fileSizes.json is staged, and the trusted
          # PublishSnapshot job uploads it to the hard-coded snapshot path.
          - bash: |
                set -euo pipefail
                OUT="$(Build.ArtifactStagingDirectory)/file-size-report"
                mkdir -p "$OUT"
                cp packages/tools/tests/dist/fileSizes.json "$OUT/fileSizes.json"
            displayName: "Collect file size results"

          - template: templates/stage-upload.yml
            parameters:
                sourceDir: "$(Build.ArtifactStagingDirectory)/file-size-report"
                artifact: "fileSizeReport"
                displayName: "Stage file size results"
                condition: succeeded()

    # ============================================================================
    # FORMAT, LINT, AND MORE
    # Checks formatting, linting, and circular dependencies
    # No dependencies - runs immediately
    # ============================================================================
    - job: FormatLint
      displayName: "Format, Lint, and more"
      steps:
          - template: templates/checkout-with-tag-override.yml

          - task: UseNode@1
            displayName: "Use Node 24.x"
            continueOnError: true
            retryCountOnTaskFailure: 1
            inputs:
                version: "24.x"

          - template: templates/cache-steps.yml

          - script: npm ci
            displayName: "npm ci"
            env:
                PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
                PUPPETEER_SKIP_DOWNLOAD: "true"

          - script: npx prettier --list-different "./packages/**/src/**/*.{ts,tsx,js,json,scss,css}"
            displayName: "Formatting"

          - script: npm run lint:check-ci
            displayName: "Linting"
            env:
                NODE_OPTIONS: "--max-old-space-size=8192"

          - script: npm run check:treeshaking
            displayName: "Tree-shaking verification"

    # ============================================================================
    # TYPEDOC CHECK
    # Only runs on PRs (not on master branch)
    # No dependencies - runs immediately
    # ============================================================================
    - job: TypeDocCheck
      displayName: "TypeDoc check"
      condition: ne(variables['Build.SourceBranch'], 'refs/heads/master')
      steps:
          - template: templates/checkout-with-tag-override.yml
            parameters:
                fetchDepth: 0

          - task: UseNode@1
            displayName: "Use Node 24.x"
            continueOnError: true
            retryCountOnTaskFailure: 1
            inputs:
                version: "24.x"

          - template: templates/cache-steps.yml

          - script: npm ci
            displayName: "npm ci"
            retryCountOnTaskFailure: 1
            env:
                PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
                PUPPETEER_SKIP_DOWNLOAD: "true"

          - script: |
                git branch
                git fetch origin "+refs/heads/*:refs/remotes/origin/*"
                git branch

                GIT_CHANGES_COMMAND="git diff origin/master...HEAD --name-only --relative" npm run test:docs
            displayName: "Run TypeDoc test"
            env:
                CI: "true"

          - task: PublishTestResults@2
            displayName: "Publish TypeDoc Results"
            condition: succeededOrFailed()
            inputs:
                testResultsFormat: JUnit
                testResultsFiles: "./junit.xml"
                failTaskOnFailedTests: true

    # ============================================================================
    # UNIT TESTS
    # Depends on: FormatLint (fail-fast gate only).
    # Intentionally does NOT depend on Build: the unit suite runs in-process
    # (vitest) and needs no Build snapshot. The one CDN-dependent assertion
    # (moduleFileSize.test.ts -> fileSizes.json) already self-skips when the
    # file is absent, so dropping the Build dependency changes no test outcome
    # while moving this job out of the post-Build "wave 2" (keeps peak agents
    # per PR at <= 8).
    # ============================================================================
    - job: UnitTests
      displayName: "Unit tests"
      dependsOn:
          - FormatLint
      steps:
          - template: templates/checkout-with-tag-override.yml

          - task: UseNode@1
            displayName: "Use Node 24.x"
            continueOnError: true
            retryCountOnTaskFailure: 1
            inputs:
                version: "24.x"

          - template: templates/cache-steps.yml

          - task: Npm@1
            displayName: "npm ci"
            retryCountOnTaskFailure: 1
            inputs:
                command: custom
                customCommand: "ci"

          - script: npm run test:unit
            displayName: "unit tests"
            retryCountOnTaskFailure: 2
            env:
                CDN_BASE_URL: "$(SNAPSHOT_CDN_URL)/$(BuildName)"
                HEADLESS: "true"

          - task: PublishTestResults@2
            displayName: "Publish Unit Test Results"
            condition: succeededOrFailed()
            inputs:
                testResultsFormat: JUnit
                testResultsFiles: "./junit.xml"

          # DISABLED in classic pipeline - integration tests:
          # - script: |
          #     export DISPLAY=:99
          #     Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          #     sleep 3
          #     npm run test:integration
          #   displayName: 'integration tests'
          #   continueOnError: true
          #   retryCountOnTaskFailure: 4
          #   env:
          #     CDN_BASE_URL: '$(SNAPSHOT_CDN_URL)/$(BuildName)'
          #     HEADLESS: 'true'

          # DISABLED in classic pipeline - interaction tests (moved to separate job):
          # - script: |
          #     npx playwright install --with-deps
          #     export CDN_BASE_URL="$(SNAPSHOT_CDN_URL)/$(Build.SourceBranch)"
          #     export BROWSERSTACK_USERNAME=$(BROWSERSTACK_USERNAME)
          #     export BROWSERSTACK_ACCESS_KEY=$(BROWSERSTACK_ACCESS_KEY)
          #     npm run test:interactions
          #   displayName: 'interaction tests'
          #   retryCountOnTaskFailure: 2
          #   env:
          #     CI: 'true'

    # ============================================================================
    # INTERACTION TESTS
    # Depends on: Build, FormatLint
    # ============================================================================
    - job: InteractionTests
      displayName: "Interaction tests"
      dependsOn:
          - Build
          - FormatLint
      steps:
          - template: templates/checkout-with-tag-override.yml

          - task: UseNode@1
            displayName: "Use Node 24.x"
            continueOnError: true
            retryCountOnTaskFailure: 1
            inputs:
                version: "24.x"

          - template: templates/cache-steps.yml
            parameters:
                playwright: true

          - script: |
                npm ci
                npx playwright install --with-deps
            displayName: "npm ci && playwright install"
            retryCountOnTaskFailure: 1

          - script: npm run test:interactions
            displayName: "run interaction tests"
            retryCountOnTaskFailure: 1
            env:
                CDN_BASE_URL: "$(SNAPSHOT_CDN_URL)/$(BuildName)"
                # No BrowserStack credentials: `npm run test:interactions` runs
                # `playwright test -c ./playwright.config.ts --project=interaction`,
                # which drives local browsers. The credentials that used to be
                # mapped here were never read.
                CI: "true"

          # Credential-free: the report is staged as a pipeline artifact and
          # uploaded later by the trusted PublishTestReports job.
          - template: templates/stage-upload.yml
            parameters:
                sourceDir: "packages/tools/tests/playwright-report"
                fallbackDir: "playwright-report"
                artifact: "interactionReport"
                validatePublicReport: true
                displayName: "Stage interaction test results"
                continueOnError: true

          - task: PublishTestResults@2
            displayName: "Publish interaction test results"
            condition: succeededOrFailed()
            inputs:
                testResultsFormat: JUnit
                testResultsFiles: "./packages/tools/tests/junit.xml"

    # ============================================================================
    # KHR_INTERACTIVITY CONFORMANCE
    # Depends on: Build, FormatLint
    # Runs the pinned Khronos conformance corpus against the deployed snapshot (the same artifact the
    # other browser suites test), so nothing is built inside the test agent. Gated at the job level on
    # the Build job's affected-tags output so unaffected PRs never provision an agent.
    # ============================================================================
    - job: KHRInteractivityConformance
      displayName: "KHR_interactivity conformance"
      dependsOn:
          - Build
          - FormatLint
      # Only run when a FlowGraph or glTF change (or a run-all "ALL" change) is detected by the Build
      # job's ComputeVisTags step. Evaluated before the agent is provisioned, so an unrelated PR neither
      # queues the job nor clones the repo. An unset value (e.g. ComputeVisTags failure) evaluates false
      # and skips — safe because the suite is non-blocking and informational.
      condition: >-
          and(
            succeeded(),
            or(
              eq(dependencies.Build.outputs['ComputeVisTags.AFFECTED_TAGS'], 'ALL'),
              contains(dependencies.Build.outputs['ComputeVisTags.AFFECTED_TAGS'], 'FlowGraph'),
              contains(dependencies.Build.outputs['ComputeVisTags.AFFECTED_TAGS'], 'glTF')
            )
          )
      # A single run: consuming the deployed snapshot (rather than building Babylon in-agent) makes the
      # full ~174-asset suite fast enough to finish well within the timeout on one agent, and avoids the
      # redundant per-shard npm/playwright install overhead that sharding otherwise added.
      # Kept non-blocking (continueOnError) for now so an intermittent asset does not block merges;
      # promote to a required gate once it has a track record of completing green.
      continueOnError: true
      timeoutInMinutes: 30
      steps:
          - template: templates/checkout-with-tag-override.yml

          - task: UseNode@1
            displayName: "Use Node 24.x"
            continueOnError: true
            retryCountOnTaskFailure: 1
            inputs:
                version: "24.x"

          - template: templates/cache-steps.yml
            parameters:
                playwright: true

          # The conformance assets are a large, rarely changing binary corpus, so cache them on
          # the pinned revision. The key comes from the same file the fetch script reads, so a
          # bumped revision automatically misses the cache instead of serving stale assets.
          - task: Cache@2
            displayName: "Cache KHR_interactivity assets"
            inputs:
                key: 'khrassets | "$(Agent.OS)" | scripts/khr-interactivity-assets.json'
                path: $(KHR_ASSETS_CACHE)

          - script: |
                npm ci
                npx playwright install --with-deps chromium
            displayName: "npm ci && playwright install"
            retryCountOnTaskFailure: 1

          - script: node ./scripts/runKHRInteractivityAssetTests.mjs
            displayName: "run KHR_interactivity conformance tests"
            env:
                CI: "true"
                # Force Chrome. The shared Playwright config defaults to Firefox on CI, but the
                # integration project only passes the `--use-angle=default` WebGL flag on the Chrome
                # branch, so Firefox runs the conformance suite with no working WebGL context.
                BROWSER: "Chrome"
                # Consume the Build job's deployed snapshot (empty.html + the properly built UMD bundles)
                # instead of building Babylon in-agent. This is what the other browser suites do and is
                # what keeps the agent from running out of memory.
                CDN_BASE_URL: "$(SNAPSHOT_CDN_URL)/$(BuildName)"
                KHR_ASSETS_CACHE_DIR: $(KHR_ASSETS_CACHE)

          - task: PublishTestResults@2
            displayName: "Publish KHR_interactivity conformance results"
            condition: succeededOrFailed()
            inputs:
                testResultsFormat: JUnit
                testResultsFiles: "./khr-interactivity-junit.xml"
                testRunTitle: "KHR_interactivity conformance"

          - task: PublishPipelineArtifact@1
            displayName: "Publish conformance report"
            condition: failed()
            continueOnError: true
            inputs:
                targetPath: "khr-interactivity-report"
                artifact: "khr-interactivity-report"

    # ============================================================================
    # VISUALIZATION TESTS - WEBGL 2
    # Depends on: Build, FormatLint
    # Runs on BrowserStack
    # ============================================================================
    - job: VisualizationWebGL2
      displayName: "Visualization tests - WebGL 2"
      dependsOn:
          - Build
          - FormatLint
      condition: succeeded()
      variables:
          AFFECTED_TAGS: $[ dependencies.Build.outputs['ComputeVisTags.AFFECTED_TAGS'] ]
      steps:
          - template: templates/checkout-with-tag-override.yml

          - task: UseNode@1
            displayName: "Use Node 24.x"
            continueOnError: true
            retryCountOnTaskFailure: 1
            inputs:
                version: "24.x"

          - template: templates/cache-steps.yml

          - script: |
                npm ci
            displayName: "npm ci"
            retryCountOnTaskFailure: 1
            env:
                PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
                PUPPETEER_SKIP_DOWNLOAD: "true"

          - bash: echo "No visualization tests affected by this change — skipping."
            displayName: "Skip — no affected tests"
            condition: eq(variables['AFFECTED_TAGS'], 'NONE')

          - bash: .azure-pipelines/browserstack-wait.sh npx playwright test --config ./playwright.browserstack.config.ts
            displayName: "WebGL2 BStack"
            condition: and(ne(variables['AFFECTED_TAGS'], 'NONE'), ne(variables['Build.Reason'], 'PullRequest'))
            env:
                CDN_BASE_URL: "$(SNAPSHOT_CDN_URL)/$(BuildName)"
                CI: "true"
                EXCLUDE_REGEX_ARRAY: "Procedural textures playground"
                BSTACK_TEST_TYPE: "webgl2"
                BSTACK_BUILD_NAME: "Visualization Tests - WebGL2"
                TIMEOUT: "27500"
                ${{ if ne(variables['Build.Reason'], 'PullRequest') }}:
                    BROWSERSTACK_USERNAME: $(BROWSERSTACK_USERNAME)
                    BROWSERSTACK_ACCESS_KEY: $(BROWSERSTACK_ACCESS_KEY)
                AFFECTED_TAGS: $(AFFECTED_TAGS)

          # Credential-free: the report is staged as a pipeline artifact and
          # uploaded later by the trusted PublishTestReports job.
          - template: templates/stage-upload.yml
            parameters:
                sourceDir: "packages/tools/tests/playwright-report"
                fallbackDir: "playwright-report"
                artifact: "webgl2Report"
                validatePublicReport: true
                displayName: "Stage WebGL2 visualization test results"
                continueOnError: true

          - task: PublishTestResults@2
            displayName: "Publish webgl2 test results"
            condition: succeededOrFailed()
            inputs:
                testResultsFormat: JUnit
                testResultsFiles: "./packages/tools/tests/junit.xml"

    # ============================================================================
    # VISUALIZATION TESTS - WEBGPU
    # Depends on: Build, FormatLint
    # Runs on BrowserStack
    # ============================================================================
    - job: VisualizationWebGPU
      displayName: "Visualization tests - WebGPU"
      dependsOn:
          - Build
          - FormatLint
      variables:
          AFFECTED_TAGS: $[ dependencies.Build.outputs['ComputeVisTags.AFFECTED_TAGS'] ]
      steps:
          - template: templates/checkout-with-tag-override.yml

          - task: UseNode@1
            displayName: "Use Node 24.x"
            continueOnError: true
            retryCountOnTaskFailure: 1
            inputs:
                version: "24.x"

          - template: templates/cache-steps.yml

          - script: |
                npm ci
            displayName: "npm ci"
            retryCountOnTaskFailure: 1
            env:
                PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
                PUPPETEER_SKIP_DOWNLOAD: "true"

          - bash: echo "No visualization tests affected by this change — skipping."
            displayName: "Skip — no affected tests"
            condition: eq(variables['AFFECTED_TAGS'], 'NONE')

          - bash: .azure-pipelines/browserstack-wait.sh npx playwright test --config ./playwright.browserstack.config.ts
            displayName: "WebGPU BStack"
            condition: and(ne(variables['AFFECTED_TAGS'], 'NONE'), ne(variables['Build.Reason'], 'PullRequest'))
            retryCountOnTaskFailure: 1
            env:
                CDN_BASE_URL: "$(SNAPSHOT_CDN_URL)/$(BuildName)"
                CI: "true"
                EXCLUDE_REGEX_ARRAY: "Sample depth texture,Render to 3D RT,apply-all-post-processes"
                BSTACK_TEST_TYPE: "webgpu"
                BSTACK_BUILD_NAME: "Visualization Tests - WebGPU"
                TIMEOUT: "27500"
                ${{ if ne(variables['Build.Reason'], 'PullRequest') }}:
                    BROWSERSTACK_USERNAME: $(BROWSERSTACK_USERNAME)
                    BROWSERSTACK_ACCESS_KEY: $(BROWSERSTACK_ACCESS_KEY)
                AFFECTED_TAGS: $(AFFECTED_TAGS)

          # Credential-free: the report is staged as a pipeline artifact and
          # uploaded later by the trusted PublishTestReports job.
          - template: templates/stage-upload.yml
            parameters:
                sourceDir: "packages/tools/tests/playwright-report"
                fallbackDir: "playwright-report"
                artifact: "webgpuReport"
                validatePublicReport: true
                displayName: "Stage WebGPU visualization test results"
                continueOnError: true

          - task: PublishTestResults@2
            displayName: "Publish webgpu test results"
            condition: succeededOrFailed()
            inputs:
                testResultsFormat: JUnit
                testResultsFiles: "./packages/tools/tests/junit.xml"

    # ============================================================================
    # NATIVE TESTS (EXPERIMENTAL)
    # Depends on: Build, FormatLint
    # Runs on Windows agent pool
    # ============================================================================
    - job: NativeTests
      displayName: "Native tests (experimental)"
      dependsOn:
          - Build
          - FormatLint
      timeoutInMinutes: 35
      pool:
          vmImage: windows-latest
      steps:
          - template: templates/checkout-with-tag-override.yml

          - task: DownloadPipelineArtifact@2
            displayName: "Download Pipeline Artifact"
            inputs:
                source: specific
                project: "$(DEVOPS_PROJECT_ID)"
                pipeline: 36
                runVersion: latest
                runBranch: "refs/heads/master"
                path: "$(Pipeline.Workspace)"

          - script: |
                for /f %%i in ('"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere" -property instanceId') do (
                  reg add HKCU\Software\Microsoft\VisualStudio\Debugger\JIT\{F200A7E7-DEA5-11D0-B854-00A0244A1DE2}\%%i /f /v Disabled /t REG_DWORD /d 1
                )

                reg query HKCU\Software\Microsoft\VisualStudio\Debugger\JIT\{F200A7E7-DEA5-11D0-B854-00A0244A1DE2} /s
            displayName: "Disable JIT Debugging for Script"

          - script: |
                REM The snapshot-existence probe that used to run here required
                REM the deployment token. Its result was only echoed, never used,
                REM so it was removed rather than keeping a credential in this
                REM job. The download below uses the public CDN and needs no
                REM credential.
                curl --fail-with-body --silent --show-error "$(SNAPSHOT_CDN_URL)/$(BuildName)/cdnSnapshot.zip" -o snapshot.zip
                if errorlevel 1 exit /b %errorlevel%

                setlocal EnableDelayedExpansion
                set destDir=..\BabylonNativeNightlyUnitTests\RelWithDebInfo\Assets
                for /f %%i in ('dir /b %destDir%\babylon*') do (
                  set sourceName=%%i
                  if /i "!sourceName:~-3!"==".js" (
                    set sourceName=!sourceName:.max.js=.es5.js!
                    if "!sourceName!"=="%%i" set sourceName=!sourceName:.min.js=.es5.js!
                    if "!sourceName!"=="%%i" set sourceName=!sourceName:.js=.es5.js!
                  )
                  unzip -p snapshot.zip "**!sourceName!" > %destDir%\%%i
                  if errorlevel 1 exit /b !errorlevel!
                )

                set destDir=..\BabylonNativeNightlyPlayground\RelWithDebInfo\Scripts
                for /f %%i in ('dir /b %destDir%\babylon*') do (
                  set sourceName=%%i
                  if /i "!sourceName:~-3!"==".js" (
                    set sourceName=!sourceName:.max.js=.es5.js!
                    if "!sourceName!"=="%%i" set sourceName=!sourceName:.min.js=.es5.js!
                    if "!sourceName!"=="%%i" set sourceName=!sourceName:.js=.es5.js!
                  )
                  unzip -p snapshot.zip "**!sourceName!" > %destDir%\%%i
                  if errorlevel 1 exit /b !errorlevel!
                )
            displayName: "Update scripts from snapshot (ES5)"

          - script: |
                cd
                cd ..\BabylonNativeNightlyUnitTests\RelWithDebInfo
                UnitTests.exe
            displayName: "Run unit tests"
            retryCountOnTaskFailure: 3

          - script: |
                cd
                cd ..\BabylonNativeNightlyPlayground\RelWithDebInfo
                Playground.exe app:///Scripts/validation_native.js
            displayName: "Run visualization tests"
            retryCountOnTaskFailure: 3

          - pwsh: |
                New-Item -ItemType Directory -Force -Path "..\BabylonNativeNightlyPlayground\Results" | Out-Null
                New-Item -ItemType Directory -Force -Path "..\BabylonNativeNightlyPlayground\Errors" | Out-Null
            displayName: "Ensure native visualization output dirs"
            condition: not(canceled())

          - task: PublishPipelineArtifact@1
            displayName: "Upload Rendered Pictures"
            condition: not(canceled())
            inputs:
                targetPath: "$(Build.SourcesDirectory)\\..\\BabylonNativeNightlyPlayground\\Results"
                artifact: "native-rendered-pictures-$(System.JobAttempt)"
                publishLocation: "pipeline"

          - task: PublishPipelineArtifact@1
            displayName: "Upload Error Pictures"
            condition: failed()
            inputs:
                targetPath: "$(Build.SourcesDirectory)\\..\\BabylonNativeNightlyPlayground\\Errors"
                artifact: "native-error-pictures-$(System.JobAttempt)"
                publishLocation: "pipeline"

    # ============================================================================
    # PERFORMANCE TESTS
    # Depends on: Build, FormatLint
    # Runs on BrowserStack — each test runs baseline + candidate interleaved
    # on the same remote machine to ensure consistent comparison.
    # Non-blocking: failures do not fail the overall pipeline.
    # ============================================================================
    - job: PerformanceTests
      displayName: "Performance tests"
      dependsOn:
          - Build
          - FormatLint
      continueOnError: true
      variables:
          AFFECTED_TAGS: $[ dependencies.Build.outputs['ComputeVisTags.AFFECTED_TAGS'] ]
      steps:
          - checkout: self
            clean: true
            fetchTags: false
            persistCredentials: false

          - task: UseNode@1
            displayName: "Use Node 24.x"
            continueOnError: true
            retryCountOnTaskFailure: 1
            inputs:
                version: "24.x"

          - template: templates/cache-steps.yml

          - script: npm ci
            displayName: "npm ci"
            retryCountOnTaskFailure: 1
            env:
                PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
                PUPPETEER_SKIP_DOWNLOAD: "true"

          - bash: .azure-pipelines/browserstack-wait.sh npx playwright test --config ./playwright.browserstack.config.ts
            displayName: "Run performance tests (BStack)"
            condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
            continueOnError: true
            env:
                CDN_BASE_URL: "$(SNAPSHOT_CDN_URL)/$(BuildName)"
                CI: "true"
                BSTACK_TEST_TYPE: "performance"
                BSTACK_BUILD_NAME: "Performance Tests - $(BuildName)"
                VISUALIZATION_PERF: "true"
                CDN_VERSION: "latest"
                CIWORKERS: "$(CIWORKERS)"
                TIMEOUT: "300000"
                PERF_COMMENT_FILE: "$(Build.ArtifactStagingDirectory)/perf-comment.md"
                ${{ if ne(variables['Build.Reason'], 'PullRequest') }}:
                    BROWSERSTACK_USERNAME: $(BROWSERSTACK_USERNAME)
                    BROWSERSTACK_ACCESS_KEY: $(BROWSERSTACK_ACCESS_KEY)
                AFFECTED_TAGS: $(AFFECTED_TAGS)
                BSTACK_SESSIONS_REQUIRED: "2"

          # Credential-free: the comment body is published as an artifact and
          # posted later by the trusted PublishTestReports job. It is generated
          # by pull-request-controlled test code, so it is treated as untrusted
          # text and sanitized on the trusted side before use.
          - bash: |
                set -euo pipefail
                OUT="$(Build.ArtifactStagingDirectory)/perf-comment-artifact"
                mkdir -p "$OUT"
                if [ -f "$(Build.ArtifactStagingDirectory)/perf-comment.md" ]; then
                    cp "$(Build.ArtifactStagingDirectory)/perf-comment.md" "$OUT/comment.md"
                else
                    echo "No performance comment file found"
                fi
            displayName: "Stage performance comment"
            condition: succeededOrFailed()

          - task: PublishPipelineArtifact@1
            displayName: "Publish performance comment"
            condition: succeededOrFailed()
            continueOnError: true
            inputs:
                targetPath: "$(Build.ArtifactStagingDirectory)/perf-comment-artifact"
                artifact: "perfComment"

          - task: PublishTestResults@2
            displayName: "Publish performance test results"
            condition: succeededOrFailed()
            inputs:
                testResultsFormat: "JUnit"
                testResultsFiles: "junit.xml"
                testRunTitle: "Performance Tests"

    # ============================================================================
    # MEMORY LEAK TESTS
    # Depends on: Build, FormatLint
    # Split into two parallel jobs (ci + packages suites) — see
    # templates/memory-leak-job.yml. Each runs memlab locally (BrowserStack is
    # not viable for heap snapshots) and is non-blocking. Running them in
    # parallel instead of sequentially shortens the post-Build critical-path
    # tail. UnitTests was moved out of "wave 2", so adding one job here keeps
    # the peak parallel jobs per PR at <= 8.
    # ============================================================================
    - template: templates/memory-leak-job.yml
      parameters:
          jobName: MemoryLeakTestsCI
          commentArtifact: memleakCommentCI
          displayName: "Memory leak tests (ci suite)"
          npmScript: "test:memory-leaks"
          suiteLabel: "ci suite"
          # First-class PR-facing suite: always posts a single results comment.
          alwaysComment: true

    - template: templates/memory-leak-job.yml
      parameters:
          jobName: MemoryLeakTestsPackages
          commentArtifact: memleakCommentPackages
          displayName: "Memory leak tests (packages suite)"
          npmScript: "test:memory-leaks:packages"
          suiteLabel: "packages suite"
          # Secondary suite: stays silent only on a clean pass, and still
          # comments on any leak or runner error, so the common (clean) case
          # keeps the PR to a single memory-leak comment without hiding failures.
          alwaysComment: false

    # ============================================================================
    # VIEWER TESTS
    # No dependencies - runs immediately
    # ============================================================================
    - job: ViewerTests
      displayName: "Viewer tests"
      steps:
          - template: templates/checkout-with-tag-override.yml

          - task: UseNode@1
            displayName: "Use Node 24.x"
            continueOnError: true
            retryCountOnTaskFailure: 1
            inputs:
                version: "24.x"

          - template: templates/cache-steps.yml
            parameters:
                playwright: true

          - task: Npm@1
            displayName: "npm ci"
            retryCountOnTaskFailure: 1
            inputs:
                command: custom
                customCommand: "ci"

          - task: Npm@1
            displayName: "npm build"
            retryCountOnTaskFailure: 1
            inputs:
                command: custom
                customCommand: "run build:dev"

          - script: |
                (npm run serve -w @tools/viewer &)
                npx playwright install --with-deps
                npm run test:playwright -w @tools/tests -- --project=viewer
            displayName: "run tests"
            retryCountOnTaskFailure: 1
            env:
                PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
                PUPPETEER_SKIP_DOWNLOAD: "true"
                CI: "true"
                BROWSER: "Chrome"

    # ============================================================================
    # TRUSTED PUBLISH JOBS
    #
    # Everything above this point runs pull-request-controlled code (npm
    # lifecycle scripts, build scripts, Playwright specs) and is therefore
    # completely credential-free: no deployment token, no GitHub service
    # connection. Those jobs only produce immutable pipeline artifacts.
    #
    # The jobs below hold the credentials. They run with `checkout: none`, so
    # no pull-request file is ever placed on their agents and no
    # pull-request-controlled step can execute in them. Upload destinations and
    # comment bodies are literals declared here, in trusted YAML, and are never
    # read out of a downloaded artifact.
    # ============================================================================
    - template: templates/publish-uploads-job.yml
      parameters:
          jobName: PublishSnapshot
          displayName: "Publish snapshot (trusted)"
          dependsOn:
              - Build
              - ES6Tools
          condition: succeededOrFailed()
          variables:
              BuildResult: $[ dependencies.Build.result ]
              WHATSNEWCHANGED: $[ dependencies.Build.outputs['GitChanges.WhatsNewChanged'] ]
              PACKAGEJSONCHANGED: $[ dependencies.Build.outputs['GitChanges.PackageJsonChanged'] ]
              CONFIGJSONCHANGED: $[ dependencies.Build.outputs['GitChanges.ConfigJsonChanged'] ]
              SMARTFILTERSCHANGED: $[ dependencies.Build.outputs['GitChanges.SmartFiltersChanged'] ]
          snapshotChecks:
              - name: SNAPSHOTEXISTS
                path: "$(BuildName)"
          deletes:
              - path: "$(BuildName)"
                displayName: "Clear snapshot"
                condition: and(eq(variables['SNAPSHOTEXISTS'], 'true'), not(eq(variables['Build.SourceBranchName'], 'master')))
          uploads:
              - artifact: buildSnapshot
                destination: "$(BuildName)"
                deleteStale: false
                extraFields: "saveZip=true"
                displayName: "Upload snapshot"
              - artifact: fileSizeReport
                destination: "$(BuildName)"
                deleteStale: false
                extraFields: ""
                displayName: "Upload file size results"
          fileComments: []
          comments:
              - displayName: "Tag your PR!"
                condition: and(eq(variables['BuildResult'], 'Succeeded'), eq(variables['SNAPSHOTEXISTS'], 'false'))
                body: |
                    Please make sure to label your PR with "bug", "new feature" or "breaking change" label(s).
                    To prevent this PR from going to the changelog marked it with the "skip changelog" label.
              - displayName: "What's new comment"
                condition: and(eq(variables['BuildResult'], 'Succeeded'), eq(variables['WHATSNEWCHANGED'], 'true'))
                body: |
                    There is no need to update the "what's new.md" file. A changelog will be generated using the PR and its tags.
              - displayName: "Did package.json changed?"
                condition: and(eq(variables['BuildResult'], 'Succeeded'), eq(variables['PACKAGEJSONCHANGED'], 'true'))
                body: |
                    Reviewer - this PR has made changes to one or more package.json files.
              - displayName: "Did build directory changed"
                condition: and(eq(variables['BuildResult'], 'Succeeded'), eq(variables['CONFIGJSONCHANGED'], 'true'))
                body: |
                    Reviewer - this PR has made changes to the build configuration file.

                    *This build will release a new package on npm*

                    If that was unintentional please make sure to revert those changes or close this PR.
              - displayName: "Writing GitHub comment"
                condition: and(eq(variables['BuildResult'], 'Succeeded'), eq(variables['SNAPSHOTEXISTS'], 'false'))
                body: |
                    Snapshot stored with reference name:
                    $(BuildName)

                    Test environment:
                    $(SNAPSHOT_CDN_URL)/$(BuildName)/index.html

                    To test a playground add it to the URL, for example:

                    $(SNAPSHOT_CDN_URL)/$(BuildName)/index.html#WGZLGJ#4600

                    Links to test your changes to core in the published versions of the Babylon tools (does not contain changes you made to the tools themselves):

                    https://playground.babylonjs.com/?snapshot=$(BuildName)
                    https://sandbox.babylonjs.com/?snapshot=$(BuildName)
                    https://gui.babylonjs.com/?snapshot=$(BuildName)
                    https://nme.babylonjs.com/?snapshot=$(BuildName)

                    To test the snapshot in the playground with a playground ID add it after the snapshot query string:

                    https://playground.babylonjs.com/?snapshot=$(BuildName)#BCU1XR#0

                    *If you made changes to the sandbox or playground in this PR, additional comments will be generated soon containing links to the dev versions of those tools.*
              - displayName: "Writing SFE GitHub comment"
                condition: and(eq(variables['BuildResult'], 'Succeeded'), eq(variables['SMARTFILTERSCHANGED'], 'true'))
                body: |
                    Smart Filters Editor is available to test at:
                    https://sfe.babylonjs.com/?snapshot=$(BuildName)

    - template: templates/publish-uploads-job.yml
      parameters:
          jobName: PublishTestReports
          displayName: "Publish test reports (trusted)"
          dependsOn:
              - PublishSnapshot
              - ES6
              - InteractionTests
              - VisualizationWebGL2
              - VisualizationWebGPU
              - PerformanceTests
              - MemoryLeakTestsCI
              - MemoryLeakTestsPackages
          condition: succeededOrFailed()
          timeoutInMinutes: 30
          variables:
              SNAPSHOTEXISTS: $[ dependencies.PublishSnapshot.outputs['SNAPSHOTEXISTS.SNAPSHOTEXISTS'] ]
          snapshotChecks: []
          deletes: []
          uploads:
              - artifact: es6visReport
                destination: "$(BuildName)/testResults/es6visplaywright"
                deleteStale: true
                extraFields: ""
                displayName: "Upload ES6 visualization test results"
              - artifact: interactionReport
                destination: "$(BuildName)/testResults/interactionplaywright"
                deleteStale: true
                extraFields: ""
                displayName: "Upload interaction test results"
              - artifact: webgl2Report
                destination: "$(BuildName)/testResults/webgl2playwright"
                deleteStale: true
                extraFields: ""
                displayName: "Upload WebGL2 visualization test results"
              - artifact: webgpuReport
                destination: "$(BuildName)/testResults/webgpuplaywright"
                deleteStale: true
                extraFields: ""
                displayName: "Upload WebGPU visualization test results"
          fileComments:
              - displayName: "Post performance results"
                artifact: perfComment
                file: comment.md
                condition: succeededOrFailed()
              - displayName: "Post memory leak results (CI)"
                artifact: memleakCommentCI
                file: comment.md
                condition: succeededOrFailed()
              - displayName: "Post memory leak results (packages)"
                artifact: memleakCommentPackages
                file: comment.md
                condition: succeededOrFailed()
          comments:
              - displayName: "Interaction test report comment"
                condition: eq(variables['SNAPSHOTEXISTS'], 'false')
                body: |
                    Interaction tests

                    $(SNAPSHOT_CDN_URL)/$(BuildName)/testResults/interactionplaywright/index.html
              - displayName: "GitHub WebGL2 comment"
                condition: eq(variables['SNAPSHOTEXISTS'], 'false')
                body: |
                    WebGL2 visualization test reporter:

                    $(SNAPSHOT_CDN_URL)/$(BuildName)/testResults/webgl2playwright/index.html
              - displayName: "GitHub WebGPU comment"
                condition: eq(variables['SNAPSHOTEXISTS'], 'false')
                body: |
                    Visualization tests for WebGPU

                    $(SNAPSHOT_CDN_URL)/$(BuildName)/testResults/webgpuplaywright/index.html

    # ============================================================================
    # DEPLOY
    # Depends on: Build, UnitTests, VisualizationWebGL2, ES6, ES6Tools,
    #             VisualizationWebGPU, InteractionTests
    # Only runs on master/preview branch for Manual/ResourceTrigger/Schedule/
    # BuildCompletion builds
    # ============================================================================
    - job: Deploy
      displayName: "Deploy"
      dependsOn:
          - Build
          - UnitTests
          - VisualizationWebGL2
          - ES6
          - ES6Tools
          - VisualizationWebGPU
          - InteractionTests
      condition: >-
          and(
            succeeded(),
            or(
              eq(variables['Build.SourceBranchName'], 'master'),
              eq(variables['Build.SourceBranchName'], 'preview')
            ),
            or(
              eq(variables['Build.Reason'], 'Manual'),
              eq(variables['Build.Reason'], 'ResourceTrigger'),
              eq(variables['Build.Reason'], 'Schedule'),
              eq(variables['Build.Reason'], 'BuildCompletion')
            )
          )
      steps:
          # This job holds the deployment token, so it must never have
          # pull-request code on its agent. It only moves already-published
          # artifacts between CDN paths, so no checkout is required.
          - checkout: none

          - bash: mkdir download
            displayName: "Prepare download directory"

          - script: |
                curlAuth() { printf 'header = "Authorization: %s"\n' "$DEPLOY_TOKEN" | curl --config - "$@"; }
                set -euo pipefail

                curlAuth --fail-with-body --silent --show-error "$(SNAPSHOT_CDN_URL)/$(BuildName)/cdnSnapshot.zip" -o snapshot.zip

                curlAuth --fail-with-body --silent --show-error $(DEPLOYMENT_SERVER)/$(DEPLOY_ENDPOINT_UPLOAD) -i -X POST \
                  -H "Content-Type: multipart/form-data" \
                  -F "path=cdn/$(Build.SourceBranchName)" \
                  -F "storageAccount=$(SNAPSHOTS_STORAGE_ACCOUNT)" \
                  -F "zip=@snapshot.zip"

                curlAuth --fail-with-body --silent --show-error "$(SNAPSHOT_CDN_URL)/$(BuildName)/fileSizes.json" -o fileSizes.json

                zip ./fileSize.zip fileSizes.json

                curlAuth --fail-with-body --silent --show-error $(DEPLOYMENT_SERVER)/$(DEPLOY_ENDPOINT_UPLOAD) -i -X POST \
                  -H "Content-Type: multipart/form-data" \
                  -F "path=cdn/$(Build.SourceBranchName)" \
                  -F "storageAccount=$(SNAPSHOTS_STORAGE_ACCOUNT)" \
                  -F "zip=@fileSize.zip"
            displayName: "Update CDN"
            env:
                DEPLOY_TOKEN: $(DEPLOY_TOKEN)

          - script: |
                curlAuth() { printf 'header = "Authorization: %s"\n' "$DEPLOY_TOKEN" | curl --config - "$@"; }
                set -euo pipefail

                # Async purge: don't block CI on the CDN purge completing.
                curlAuth --fail-with-body --silent --show-error "$(DEPLOYMENT_SERVER)/$(DEPLOY_ENDPOINT_PURGE)?endpoint=$(CDN_ENDPOINT_CDN)&profileName=$(CDN_PROFILE_CDN)&wait=false" -i -X POST

                curlAuth --fail-with-body --silent --show-error "$(DEPLOYMENT_SERVER)/$(DEPLOY_ENDPOINT_PURGE)?endpoint=$(CDN_ENDPOINT_PREVIEW_CDN)&profileName=$(CDN_PROFILE_CDN)&wait=false" -i -X POST
            displayName: "Purge CDN"
            env:
                DEPLOY_TOKEN: $(DEPLOY_TOKEN)
