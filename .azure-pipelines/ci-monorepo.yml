# =============================================================================
# CI Monorepo Pipeline (Definition ID: 14) - root
#
# SECURITY: this file is the *root* of a pipeline that is evaluated from pull
# request branches. It deliberately contains no `variables`, no `jobs` and no
# `steps`; everything that can reference a credential lives in the trusted
# template named by `extends` below.
#
# `extends` is the only pipeline construct Azure DevOps' "Required template"
# check understands. With this shape an administrator can require that
# templates/ci-monorepo-pipeline.yml comes from refs/heads/master before a
# protected variable group or service connection is released to the run, and a
# pull request that rewrites this file, or the template on its own branch, is
# denied the credential instead of being handed it.
#
# Add pipeline logic to the template, not here.
# =============================================================================

trigger:
    batch: true
    branches:
        include:
            - master
    paths:
        exclude:
            - .build/config.json
            - CHANGELOG.md

pr:
    branches:
        include:
            - master

schedules:
    # Classic pipeline: midnight PST on Mon, Tue, Wed, Fri (daysToBuild: 23)
    # Cron is in UTC: midnight PST = 08:00 UTC
    - cron: "0 8 * * 1,2,3,5"
      displayName: Scheduled build
      branches:
          include:
              - master
      always: false # Only run if there are changes

resources:
    pipelines:
        # Build completion trigger - cd-publish pipeline (Definition 15)
        - pipeline: buildCompletionTrigger
          source: "Publish pipeline"
          trigger:
              branches:
                  include:
                      - master
        # Native tests artifact source - pipeline ID 36
        - pipeline: nativeTestsArtifact
          source: "BabylonNative Nightly CI"
          project: ContinousIntegration

extends:
    template: templates/ci-monorepo-pipeline.yml
