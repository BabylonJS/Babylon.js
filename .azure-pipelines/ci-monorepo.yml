# =============================================================================
# CI Monorepo Pipeline (Definition ID: 14) - root
#
# SECURITY: this file is the root of a pipeline that Azure DevOps compiles from
# pull request branches. A pull request can rewrite every line of it, and every
# line of templates/ci-monorepo-pipeline.yml, because that
# template lives on the same branch. An Azure DevOps "Required template" check
# cannot help here either - it can only pin a template that comes from a
# separate, protected repository or ref, which this repository does not have.
#
# The guarantee is therefore not "the YAML is trusted". It is that this
# pipeline, root and template together, requests NO secret-bearing protected
# resource:
#
#   * no BabylonJS-Deployment (DEPLOY_TOKEN)
#   * no Browserstack-Opensource
#   * no GitHub service connection
#
# There is nothing in the run for a malicious pull request to steal. Everything
# that needs a credential lives in a definition with `pr: none`:
#
#   * .azure-pipelines/cd-ci-snapshots.yml  - snapshot/report uploads, CDN
#     deployment and pull request comments
#   * .azure-pipelines/ci-browser-testing.yml - BrowserStack runs
#   * .azure-pipelines/cd-publish.yml / cd-tools.yml - releases and tool
#     deployments
#
# The Azure DevOps administrator must keep this pipeline definition
# *unauthorized* for every secret variable group and service connection. That
# authorization, not this comment, is what enforces the boundary.
#
# `.azure-pipelines/scripts/validate-pipeline-trust-boundary.mjs` fails CI if a
# secret group is reintroduced here or into the template.
# =============================================================================

trigger:
    batch: true
    branches:
        include:
            - master
    paths:
        exclude:
            - .build/config.json
            - CHANGELOG.md

pr:
    branches:
        include:
            - master

schedules:
    # Classic pipeline: midnight PST on Mon, Tue, Wed, Fri (daysToBuild: 23)
    # Cron is in UTC: midnight PST = 08:00 UTC
    - cron: "0 8 * * 1,2,3,5"
      displayName: Scheduled build
      branches:
          include:
              - master
      always: false # Only run if there are changes

resources:
    pipelines:
        # Build completion trigger - cd-publish pipeline (Definition 15)
        - pipeline: buildCompletionTrigger
          source: "Publish pipeline"
          trigger:
              branches:
                  include:
                      - master
        # Native tests artifact source - pipeline ID 36
        - pipeline: nativeTestsArtifact
          source: "BabylonNative Nightly CI"
          project: ContinousIntegration

extends:
    template: templates/ci-monorepo-pipeline.yml
