# =============================================================================
# GraphTools-CI Pipeline (Definition ID: 33)
# Converted from Azure DevOps Classic Pipeline
#
# Triggers on PRs that touch graph tool editor files.
# Builds NME, NGE, NRGE, GUI Editor, NPE, FGE, SFE, deploys snapshots, and runs
# Playwright tests.
#
# Variable groups:
#   - BabylonJS-CI-Infrastructure
#   - BabylonJS-Deployment (DEPLOY_TOKEN, DEPLOYMENT_SERVER)
#
# CI TRUST BOUNDARY
# -----------------
# This pipeline is triggered by pull requests, so every job that checks the
# repository out executes pull-request-controlled code. Those jobs are
# credential-free: they build, test, and stage their output as pipeline
# artifacts, and nothing more.
#
# All deployment-token and GitHub-service-connection work happens in the
# DeployTools and PublishToolsResults jobs, which run with `checkout: none` on
# freshly provisioned agents. Pull-request code is never present there, so it
# cannot read a credential, leave a background process behind to scrape one, or
# redirect an upload.
#
# Fork gating alone would not be sufficient - a compromised or malicious
# collaborator can open a same-repo pull request - which is why the separation
# is enforced by job boundaries rather than by trigger conditions.
# See the "CI trust boundary" section of VARIABLE-GROUPS.md.
# =============================================================================

trigger: none

pr:
    branches:
        include:
            - master
    paths:
        include:
            - packages/tools/nodeEditor/**/*.*
            - packages/tools/nodeGeometryEditor/**/*.*
            - packages/tools/nodeRenderGraphEditor/**/*.*
            - packages/tools/nodeParticleEditor/**/*.*
            - packages/tools/guiEditor/**/*.*
            - packages/tools/flowGraphEditor/**/*.*
            - packages/tools/smartFiltersEditor/**/*.*
            - packages/tools/smartFiltersEditorControl/**/*.*
            - packages/dev/sharedUiComponents/**/*.*
            - "**/*interaction.tools*"

variables:
    - group: BabylonJS-CI-Infrastructure
    - group: BabylonJS-Deployment
    - name: BuildName
      value: $(Build.SourceBranch)
      # Read-only: pull-request code cannot repoint deployment destinations
      # with `##vso[task.setvariable variable=BuildName]`.
      readonly: true

pool:
    vmImage: ubuntu-latest

jobs:
    # ========================================================================
    # BUILD TOOLS - executes pull-request code, holds NO credentials
    # ========================================================================
    - job: BuildTools
      displayName: "Build tools"
      steps:
          - checkout: self
            clean: true
            fetchTags: false
            persistCredentials: false

          - task: UseNode@1
            displayName: "Use Node 24.x"
            inputs:
                version: "24.x"

          - task: Npm@1
            displayName: "npm ci"
            inputs:
                command: custom
                customCommand: "ci"

          - task: Npm@1
            displayName: "npm build:dev"
            inputs:
                command: custom
                customCommand: "run build:dev"

          - task: Npm@1
            displayName: "npm build nodeEditor"
            inputs:
                command: custom
                customCommand: "run build:deployment -w @tools/node-editor"

          - task: Npm@1
            displayName: "npm build nodeGeometryEditor"
            inputs:
                command: custom
                customCommand: "run build:deployment -w @tools/node-geometry-editor"

          - task: Npm@1
            displayName: "npm build nodeRenderGraphEditor"
            inputs:
                command: custom
                customCommand: "run build:deployment -w @tools/node-render-graph-editor"

          - task: Npm@1
            displayName: "npm build guiEditor"
            inputs:
                command: custom
                customCommand: "run build:deployment -w @tools/gui-editor"

          - task: Npm@1
            displayName: "npm build nodeParticleEditor"
            inputs:
                command: custom
                customCommand: "run build:deployment -w @tools/node-particle-editor"

          - task: Npm@1
            displayName: "npm build flowGraphEditor"
            inputs:
                command: custom
                customCommand: "run build:deployment -w @tools/flow-graph-editor"

          - task: Npm@1
            displayName: "npm build smart filters"
            inputs:
                command: custom
                customCommand: "run build:source:smart-filters"

          - task: Npm@1
            displayName: "npm build smartFiltersEditor"
            inputs:
                command: custom
                customCommand: "run build:deployment -w @tools/smart-filters-editor"

          - template: templates/stage-tool-deployment.yml
            parameters:
                toolPackageDir: "packages/tools/nodeEditor"
                artifact: "toolDeployNodeEditor"
                displayName: "Stage NME deployment"

          - template: templates/stage-tool-deployment.yml
            parameters:
                toolPackageDir: "packages/tools/nodeGeometryEditor"
                artifact: "toolDeployNodeGeometryEditor"
                displayName: "Stage NGE deployment"

          - template: templates/stage-tool-deployment.yml
            parameters:
                toolPackageDir: "packages/tools/nodeRenderGraphEditor"
                artifact: "toolDeployNodeRenderGraphEditor"
                displayName: "Stage NRGE deployment"

          - template: templates/stage-tool-deployment.yml
            parameters:
                toolPackageDir: "packages/tools/guiEditor"
                artifact: "toolDeployGuiEditor"
                displayName: "Stage GUI Editor deployment"

          - template: templates/stage-tool-deployment.yml
            parameters:
                toolPackageDir: "packages/tools/nodeParticleEditor"
                artifact: "toolDeployNodeParticleEditor"
                displayName: "Stage NPE deployment"

          - template: templates/stage-tool-deployment.yml
            parameters:
                toolPackageDir: "packages/tools/flowGraphEditor"
                artifact: "toolDeployFlowGraphEditor"
                displayName: "Stage FGE deployment"

          - template: templates/stage-tool-deployment.yml
            parameters:
                toolPackageDir: "packages/tools/smartFiltersEditor"
                artifact: "toolDeploySmartFiltersEditor"
                displayName: "Stage SFE deployment"

    # ========================================================================
    # DEPLOY TOOLS - trusted: `checkout: none`, no pull-request code on disk
    # ========================================================================
    - template: templates/publish-uploads-job.yml
      parameters:
          jobName: DeployTools
          displayName: "Deploy tool snapshots (trusted)"
          dependsOn:
              - BuildTools
          condition: succeeded()
          uploads:
                - artifact: "toolDeployNodeEditor"
                  destination: "TOOLS/$(BuildName)/nodeEditor"
                  deleteStale: false
                  extraFields: ""
                  displayName: "Deploy NME"
                - artifact: "toolDeployNodeGeometryEditor"
                  destination: "TOOLS/$(BuildName)/nodeGeometryEditor"
                  deleteStale: false
                  extraFields: ""
                  displayName: "Deploy NGE"
                - artifact: "toolDeployNodeRenderGraphEditor"
                  destination: "TOOLS/$(BuildName)/nodeRenderGraphEditor"
                  deleteStale: false
                  extraFields: ""
                  displayName: "Deploy NRGE"
                - artifact: "toolDeployGuiEditor"
                  destination: "TOOLS/$(BuildName)/guiEditor"
                  deleteStale: false
                  extraFields: ""
                  displayName: "Deploy GUI Editor"
                - artifact: "toolDeployNodeParticleEditor"
                  destination: "TOOLS/$(BuildName)/nodeParticleEditor"
                  deleteStale: false
                  extraFields: ""
                  displayName: "Deploy NPE"
                - artifact: "toolDeployFlowGraphEditor"
                  destination: "TOOLS/$(BuildName)/flowGraphEditor"
                  deleteStale: false
                  extraFields: ""
                  displayName: "Deploy FGE"
                - artifact: "toolDeploySmartFiltersEditor"
                  destination: "TOOLS/$(BuildName)/smartFiltersEditor"
                  deleteStale: false
                  extraFields: ""
                  displayName: "Deploy SFE"

    # ========================================================================
    # TEST TOOLS - executes pull-request code, holds NO credentials
    # Tests run against the snapshots DeployTools published to the public CDN.
    # ========================================================================
    - job: TestTools
      displayName: "Test tools"
      dependsOn:
          - DeployTools
      steps:
          - checkout: self
            clean: true
            fetchTags: false
            persistCredentials: false

          - task: UseNode@1
            displayName: "Use Node 24.x"
            inputs:
                version: "24.x"

          - task: Npm@1
            displayName: "npm ci"
            inputs:
                command: custom
                customCommand: "ci"

          - template: templates/wait-for-snapshot.yml
            parameters:
                displayName: "Wait for Babylon snapshot"

          - script: |
                npx playwright install --with-deps
                npx playwright test --project=graphTools --project=flowGraphEditor
            displayName: "Test tools"
            env:
                CI: "true"
                BROWSER: "Chrome"
                NME_BASE_URL: "$(SNAPSHOT_CDN_URL)/TOOLS/$(BuildName)/nodeEditor/"
                NGE_BASE_URL: "$(SNAPSHOT_CDN_URL)/TOOLS/$(BuildName)/nodeGeometryEditor/"
                NRGE_BASE_URL: "$(SNAPSHOT_CDN_URL)/TOOLS/$(BuildName)/nodeRenderGraphEditor/"
                NPE_BASE_URL: "$(SNAPSHOT_CDN_URL)/TOOLS/$(BuildName)/nodeParticleEditor/"
                FGE_BASE_URL: "$(SNAPSHOT_CDN_URL)/TOOLS/$(BuildName)/flowGraphEditor/"
                SFE_BASE_URL: "$(SNAPSHOT_CDN_URL)/TOOLS/$(BuildName)/smartFiltersEditor/"
                GUIEDITOR_BASE_URL: "$(SNAPSHOT_CDN_URL)/TOOLS/$(BuildName)/guiEditor/"
                SNAPSHOT: "$(BuildName)"

          - template: templates/stage-upload.yml
            parameters:
                sourceDir: "playwright-report"
                artifact: "graphToolsTestReport"
                validatePublicReport: true
                displayName: "Stage graph tools test report"
                condition: succeededOrFailed()
                continueOnError: true

    # ========================================================================
    # PUBLISH RESULTS - trusted: `checkout: none`, no pull-request code on disk
    # ========================================================================
    - template: templates/publish-uploads-job.yml
      parameters:
          jobName: PublishToolsResults
          displayName: "Publish tool results (trusted)"
          dependsOn:
              - BuildTools
              - DeployTools
              - TestTools
          condition: succeededOrFailed()
          variables:
              BuildToolsResult: $[ dependencies.BuildTools.result ]
              DeployToolsResult: $[ dependencies.DeployTools.result ]
              TestToolsResult: $[ dependencies.TestTools.result ]
          uploads:
              - artifact: "graphToolsTestReport"
                destination: "TOOLS/$(BuildName)/testResults"
                deleteStale: false
                extraFields: ""
                displayName: "Upload graph tools test report"
          comments:
              - displayName: "Tests failed message"
                condition: >-
                    or(
                      in(variables['BuildToolsResult'], 'Failed', 'Canceled'),
                      in(variables['DeployToolsResult'], 'Failed', 'Canceled'),
                      in(variables['TestToolsResult'], 'Failed', 'Canceled')
                    )
                body: |
                    Graph tools CI has failed you can find the test results at:

                    $(SNAPSHOT_CDN_URL)/TOOLS/$(BuildName)/testResults/
              - displayName: "Tests success"
                condition: eq(variables['TestToolsResult'], 'Succeeded')
                body: |
                    You have made possible changes to one or more graph tools. To test the snapshots:

                    $(SNAPSHOT_CDN_URL)/TOOLS/$(BuildName)/nodeEditor/
                    $(SNAPSHOT_CDN_URL)/TOOLS/$(BuildName)/nodeGeometryEditor/
                    $(SNAPSHOT_CDN_URL)/TOOLS/$(BuildName)/nodeParticleEditor/
                    $(SNAPSHOT_CDN_URL)/TOOLS/$(BuildName)/nodeRenderGraphEditor/
                    $(SNAPSHOT_CDN_URL)/TOOLS/$(BuildName)/flowGraphEditor/
                    $(SNAPSHOT_CDN_URL)/TOOLS/$(BuildName)/smartFiltersEditor/
                    $(SNAPSHOT_CDN_URL)/TOOLS/$(BuildName)/guiEditor/
