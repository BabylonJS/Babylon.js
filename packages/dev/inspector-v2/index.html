<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Inspector v2 Test App</title>

        <style>
            html,
            body,
            canvas,
            #container {
                width: 100%;
                height: 100%;
                padding: 0;
                margin: 0;
                overflow: hidden;
            }

            #container {
                position: relative;
            }

            #spriteCanvas {
                position: absolute;
                left: 50%;
                bottom: 16px;
                width: 200px;
                height: 140px;
                border: 2px solid white;
                border-radius: 8px;
                box-shadow: 0 4px 12px rgb(0 0 0 / 40%);
                pointer-events: none;
                transform: translateX(-50%);
                z-index: 2;
            }
        </style>
    </head>
    <body>
        <div id="container">
            <canvas id="canvas"></canvas>
        </div>
        <script type="module" src="/test/app/index.tsx"></script>
    </body>
</html>
