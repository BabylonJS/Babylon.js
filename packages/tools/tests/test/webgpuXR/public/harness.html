<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>WebGPU-XR local repro harness</title>
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #111;
            }
            #renderCanvas {
                width: 100%;
                height: 100%;
                display: block;
            }
        </style>
    </head>
    <body>
        <canvas id="renderCanvas"></canvas>
        <script src="./gpu-trace.js"></script>
        <script src="./xrtrace.js"></script>
        <script src="./mock-xr.js"></script>
        <script src="./babylon.harness.js"></script>
        <script>
            /* eslint-disable */
            (async function () {
                "use strict";
                const OUT = (window.__HARNESS = { status: "starting", log: [], gpuErrors: [], done: false });
                const T0 = Date.now();
                const say = (m) => {
                    // The elapsed stamp matters on CPU-rasterised CI agents, where a single stage
                    // (WGSL pipeline compilation, typically) can dominate the whole run.
                    const s = "+" + (Date.now() - T0) + "ms " + m;
                    OUT.log.push(s);
                    console.log("[harness]", s);
                };

                window.addEventListener("error", (e) => OUT.log.push("window error: " + e.message));
                window.addEventListener("unhandledrejection", (e) => OUT.log.push("unhandled: " + (e.reason && e.reason.message)));

                try {
                    const canvas = document.getElementById("renderCanvas");
                    const engine = new BABYLON.WebGPUEngine(canvas, { antialias: true });
                    await engine.initAsync();
                    window.__ENGINE = engine;
                    engine._device.addEventListener?.("uncapturederror", (e) => OUT.gpuErrors.push(String(e.error && e.error.message)));
                    engine._device.onuncapturederror = (e) => OUT.gpuErrors.push(String(e.error && e.error.message));
                    say("engine ready isWebGPU=" + engine.isWebGPU + " halfZ=" + engine.isNDCHalfZRange);

                    const scene = new BABYLON.Scene(engine);
                    scene.clearColor = new BABYLON.Color4(0, 0.35, 0.4, 1); // teal, matches the device probe
                    window.__SCENE = scene;

                    const camera = new BABYLON.FreeCamera("cam", new BABYLON.Vector3(0, 1.6, -3), scene);
                    camera.setTarget(new BABYLON.Vector3(0, 1.6, 0));
                    new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);

                    // Saturated, unlit geometry in colours disjoint from the teal clear, sized so it covers
                    // a big but PARTIAL slice of each eye viewport (so "clear only" and "has geometry" differ).
                    const box = BABYLON.MeshBuilder.CreateBox("box", { size: (window.__XRMOCK_CONFIG && window.__XRMOCK_CONFIG.boxSize) || 1 }, scene);
                    box.position = new BABYLON.Vector3(0, 1.6, (window.__XRMOCK_CONFIG && window.__XRMOCK_CONFIG.boxZ) || 3);
                    // A [-1,1]-convention projection used verbatim on a [0,1]-clipping engine clips
                    // everything nearer than ~2*near, so cameraMinZ lets the harness put the box inside
                    // that band and prove the half-Z NDC fix is load-bearing.
                    if (window.__XRMOCK_CONFIG && window.__XRMOCK_CONFIG.cameraMinZ) {
                        camera.minZ = window.__XRMOCK_CONFIG.cameraMinZ;
                    }
                    const mat = new BABYLON.StandardMaterial("m", scene);
                    mat.emissiveColor = new BABYLON.Color3(1, 0, 1); // magenta
                    mat.disableLighting = true;
                    box.material = mat;

                    const ground = BABYLON.MeshBuilder.CreateGround("g", { width: 20, height: 20 }, scene);
                    const gmat = new BABYLON.StandardMaterial("gm", scene);
                    gmat.emissiveColor = new BABYLON.Color3(1, 1, 0); // yellow
                    gmat.disableLighting = true;
                    ground.material = gmat;

                    scene.registerBeforeRender(() => {
                        box.rotation.y += 0.02;
                    });

                    say("scene built, starting render loop");
                    let firstFrameDone = false;
                    engine.runRenderLoop(() => {
                        scene.render();
                        if (!firstFrameDone) {
                            firstFrameDone = true;
                            say("first frame rendered (WGSL pipeline compilation done)");
                        }
                    });

                    // Warm up outside XR so shader compilation is not a confound.
                    await new Promise((r) => setTimeout(r, 500));
                    say("pre-XR frames rendered, readyMeshes=" + scene.meshes.filter((m) => m.isReady(true)).length + "/" + scene.meshes.length);

                    // MODE "default" mirrors the on-device xrtest page (createDefaultXRExperienceAsync:
                    // utility layers, pointer selection, teleportation, ...). MODE "bare" is the minimal
                    // experience helper. Both drive the identical WebGPU projection-layer render path.
                    const MODE = (window.__XRMOCK_CONFIG && window.__XRMOCK_CONFIG.experience) || "default";
                    let helper;
                    if (MODE === "default") {
                        const xr = await BABYLON.WebXRDefaultExperience.CreateAsync(scene, {
                            disableDefaultUI: true,
                            disableTeleportation: false,
                            floorMeshes: [ground],
                        });
                        window.__XR = xr;
                        helper = xr.baseExperience;
                    } else {
                        helper = await BABYLON.WebXRExperienceHelper.CreateAsync(scene);
                    }
                    window.__HELPER = helper;
                    // The WebGPU XR path is layers-only; enable the layers feature explicitly.
                    helper.featuresManager.enableFeature(BABYLON.WebXRFeatureName.LAYERS, "latest", {}, true, true);
                    say("experience=" + MODE + " layers feature enabled=" + !!helper.featuresManager.getEnabledFeature(BABYLON.WebXRFeatureName.LAYERS));

                    helper.onStateChangedObservable.add((s) => say("state -> " + s));

                    // --- variant levers (page-side only, zero engine edits) ---
                    const CFGV = window.__XRMOCK_CONFIG || {};
                    if (CFGV.a1Flush) {
                        // Device-NEGATIVE variant A1: flushFramebuffer before AND after every rig camera render.
                        scene.onBeforeCameraRenderObservable.add(() => engine.flushFramebuffer());
                        scene.onAfterCameraRenderObservable.add(() => engine.flushFramebuffer());
                        say("variant A1 (per-eye flush before+after) ARMED");
                    }
                    if (CFGV.f1Flush) {
                        // Device-NEGATIVE variant F1: flushFramebuffer after every rig camera render only.
                        scene.onAfterCameraRenderObservable.add(() => engine.flushFramebuffer());
                        say("variant F1 (per-eye flush after) ARMED");
                    }
                    if (CFGV.forceLayer0) {
                        // Synthetic negative control: pin every eye to array layer 0 so eye 1 must come back
                        // geometry-free. Validates that the pixel oracle can actually detect a miss.
                        window.__XRMOCK_FORCE_LAYER0 = true;
                        say("negative control forceLayer0 ARMED");
                    }

                    if (CFGV.synthOverwriteInFrame) {
                        // Synthetic negative control for the "later clear-only pass clobbers the drawing pass"
                        // mechanism -- the ONLY way geometry can vanish while the clear keeps presenting, with
                        // no rejected fragments and no validation error. Injected INSIDE Babylon's frame (after
                        // scene render, before engine.endFrame) so it is exactly what the device analyzer must
                        // catch: same target, same layer, loadOp clear, zero draws, after a pass that drew.
                        // "after" submits the clobber AFTER engine.endFrame has submitted the draws, which is a
                        // REAL clobber; the default hook submits before them, which is harmless. Both are kept so
                        // the analyzer is validated for true positives AND against false positives.
                        const hook = CFGV.synthOverwriteInFrame === "after" ? engine.onEndFrameObservable : scene.onAfterRenderObservable;
                        hook.add(() => {
                            const b = window.__XRMOCK_SESSION && window.__XRMOCK_SESSION._binding;
                            if (!b || !b._pool) return;
                            const entry = b._currentPoolEntry();
                            const enc = b.device.createCommandEncoder({ label: "synth-overwrite" });
                            for (let layer = 0; layer < (CFGV.arrayLayers || 2); layer++) {
                                enc.beginRenderPass({
                                    colorAttachments: [
                                        {
                                            view: entry.color.createView({ dimension: "2d", baseArrayLayer: layer, arrayLayerCount: 1 }),
                                            loadOp: "clear",
                                            storeOp: "store",
                                            clearValue: CFGV.clearColor || { r: 0, g: 0.35, b: 0.4, a: 1 },
                                        },
                                    ],
                                }).end();
                            }
                            b.device.queue.submit([enc.finish()]);
                        });
                        say("negative control synthOverwriteInFrame ARMED");
                    }

                    await helper.enterXRAsync("immersive-vr", "local-floor");
                    say("entered XR");

                    // FIDELITY: on device, controllers connect a frame or two after entry, and
                    // WebXRControllerPointerSelection then touches UtilityLayerRenderer.DefaultUtilityLayer
                    // (WebXRControllerPointerSelection.pure.ts:631) which lazily builds a SECOND Scene that
                    // re-renders the same XR camera every frame. The mock reports zero input sources, so that
                    // second scene never existed here -- which is exactly why the harness could not reproduce
                    // the device bug. Emulate the controller-driven creation directly.
                    if (CFGV.utilityLayer) {
                        const delay = typeof CFGV.utilityLayer === "number" ? CFGV.utilityLayer : 1;
                        let n = 0;
                        const obs = scene.onAfterRenderObservable.add(() => {
                            if (++n < delay) {
                                return;
                            }
                            scene.onAfterRenderObservable.remove(obs);
                            window.__UL = BABYLON.UtilityLayerRenderer.DefaultUtilityLayer;
                            say("utility layer created after frame " + n);
                        });
                    }
                    if (CFGV.deviceTelemetry) {
                        // Dry-run of the on-device telemetry payload against the mock stack, so the
                        // device build is proven working before anyone puts a headset on.
                        window.__XRTRACE.start({
                            engine: engine,
                            sessionManager: helper.sessionManager,
                            scene: scene,
                            clearColor: [0, 89, 102],
                            frames: CFGV.frameBudget || 12,
                        });
                        say("device telemetry payload ARMED");
                    }
                    OUT.status = "in-xr";

                    await new Promise((resolve) => {
                        const s = window.__XRMOCK_SESSION;
                        s.addEventListener("end", resolve);
                        setTimeout(resolve, 20000);
                    });
                    say("session ended");
                    if (window.__XRTRACE && window.__XRTRACE.started) {
                        OUT.xrtraceDigest = window.__XRTRACE.digest();
                        OUT.xrtracePayloadBytes = JSON.stringify(window.__XRTRACE.build()).length;
                        OUT.xrtraceNotes = window.__XRTRACE.notes;
                    }
                    OUT.status = "done";
                } catch (e) {
                    OUT.status = "error";
                    OUT.error = (e && (e.message || e)) + "\n" + (e && e.stack);
                    say("FATAL " + OUT.error);
                }
                OUT.mock = window.__XRMOCK_STATE;
                OUT.done = true;
            })();
        </script>
    </body>
</html>
